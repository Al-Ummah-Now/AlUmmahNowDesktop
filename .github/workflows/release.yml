name: Release
# A v1.2.3 tag on main builds every package and creates a draft GitHub release.
# A v1.2.3-preview.N tag (any -suffix) builds QA-configured packages and publishes a GitHub
# pre-release at once, so testers can download it.
# Run it by hand on main, or change packaging in a pull request, for a dry run: same builds and
# install checks, no release.
#
# Store infrastructure (docs/RELEASE.md). Nothing here fails because an owner value is missing; the
# step is skipped with a ::notice:: naming it.
#   MSIX (viewer + Studio) is always built: Partner Center identity from WINDOWS_PUBLISHER,
#     WINDOWS_VIEWER_PACKAGE_NAME, WINDOWS_STUDIO_PACKAGE_NAME (repo variables or secrets), placeholder
#     identity otherwise; uploaded unsigned as the msix-* artifact.
#   Signed MSIX for the GitHub release: WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD.
#   Microsoft Store draft submission (full releases only): MSSTORE_TENANT_ID, MSSTORE_SELLER_ID,
#     MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET + variables MSSTORE_VIEWER_PRODUCT_ID,
#     MSSTORE_STUDIO_PRODUCT_ID; MSSTORE_COMMIT=true submits it for certification.
#   Samsung-signed TPK: TIZEN_AUTHOR_P12_BASE64, TIZEN_AUTHOR_PASSWORD,
#     TIZEN_DISTRIBUTOR_P12_BASE64, TIZEN_DISTRIBUTOR_PASSWORD.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Packaging changes are dry-run on their pull request.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/build-deb.sh
      - scripts/release-notes.py
      - scripts/stamp-version.py
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the dry-run packages (1.2.3 or 1.2.3-preview.1)
        required: true
        default: 0.0.1-dryrun.1
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      prod: ${{ steps.version.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only release from main
        if: github.event_name != 'pull_request'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push) v="${GITHUB_REF_NAME#v}" ;;
            pull_request) v="0.0.0-pr.${{ github.event.number }}" ;;
            *) v="$INPUT_VERSION" ;;
          esac
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          numeric="${v%%-*}"
          if [ "$v" != "$numeric" ]; then pre=true; prod=false; else pre=false; prod=true; fi
          {
            echo "version=$v"
            echo "numeric=$numeric"
            echo "prerelease=$pre"
            # Pre-releases point at QA; only full releases default to production.
            echo "prod=$prod"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        run: ./scripts/fetch-core.sh
      - name: Test shared layers
        run: |
          dotnet test tests/AlUmmahNow.App.Tests -c Release
          dotnet test tests/AlUmmahNow.Studio.Tests -c Release

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: AlUmmahNow.Studio.Windows
            package: AlUmmahNow-Studio-Windows
            product: Al Ummah Now Studio
            exe: AlUmmahNowStudio.exe
            dir: Al Ummah Now Studio
            upgrade: 174DD000-F5DA-4A3E-944A-13F95EFA96C0
            app: STUDIO
            smoke: true
          - project: AlUmmahNow.Windows
            package: AlUmmahNow-Windows
            product: Al Ummah Now
            exe: AlUmmahNow.exe
            dir: Al Ummah Now
            upgrade: 0DAC7B41-DEF7-4BCA-B1D5-AF7683E1D605
            app: VIEWER
            smoke: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Stamp version
        run: python scripts/stamp-version.py ${{ needs.verify.outputs.numeric }}
      - name: Publish self-contained
        run: dotnet publish src/${{ matrix.project }} -c Release -r win-x64 --self-contained -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:AunProd=${{ needs.verify.outputs.prod }} -p:Version=${{ needs.verify.outputs.numeric }} -p:InformationalVersion=${{ needs.verify.outputs.version }} -o out/publish
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/publish/* -DestinationPath "dist/${{ matrix.package }}-${{ needs.verify.outputs.version }}-x64-portable-unsigned.zip"
      - name: MSI installer (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/app.wxs -arch x64 `
            -d Version=${{ needs.verify.outputs.numeric }} `
            -d "PublishDir=$((Resolve-Path out/publish).Path)" `
            -d "ProductName=${{ matrix.product }}" `
            -d "ExeName=${{ matrix.exe }}" `
            -d "InstallDirName=${{ matrix.dir }}" `
            -d "UpgradeCode={${{ matrix.upgrade }}}" `
            -o "dist/${{ matrix.package }}-${{ needs.verify.outputs.version }}-x64-unsigned.msi"
      - name: Install, launch and uninstall the MSI
        if: matrix.smoke
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist/${{ matrix.package }}-${{ needs.verify.outputs.version }}-x64-unsigned.msi").Path
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install failed: $($p.ExitCode)" }
          $exe = "$env:ProgramFiles\${{ matrix.dir }}\${{ matrix.exe }}"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\${{ matrix.product }}.lnk")) { throw "no Start menu shortcut" }
          New-Item -ItemType Directory -Force smoke | Out-Null
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell installed (Resolve-Path smoke).Path
          if (-not (Select-String -Quiet "RESULT PASS" smoke/installed.txt)) { throw "installed app did not start" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe) { throw "uninstall left the app behind" }
      - name: MSIX package (Partner Center identity when configured)
        id: msix
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ vars[format('WINDOWS_{0}_PACKAGE_NAME', matrix.app)] || secrets[format('WINDOWS_{0}_PACKAGE_NAME', matrix.app)] }}
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER || secrets.WINDOWS_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_PUBLISHER_DISPLAY_NAME }}
        run: |
          $m = (Resolve-Path "src/${{ matrix.project }}/Package.appxmanifest").Path
          [xml]$x = Get-Content -Encoding utf8 $m
          if ($env:PACKAGE_NAME -and $env:PUBLISHER) {
            $x.Package.Identity.Name = $env:PACKAGE_NAME
            $x.Package.Identity.Publisher = $env:PUBLISHER
            "identity=store" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "::notice::${{ matrix.product }} MSIX uses the placeholder identity: set WINDOWS_PUBLISHER and WINDOWS_${{ matrix.app }}_PACKAGE_NAME (docs/RELEASE.md)"
            "identity=placeholder" >> $env:GITHUB_OUTPUT
          }
          if ($env:PUBLISHER_DISPLAY_NAME) { $x.Package.Properties.PublisherDisplayName = $env:PUBLISHER_DISPLAY_NAME }
          $x.Save($m)
          if ($x.Package.Identity.Version -ne "${{ needs.verify.outputs.numeric }}.0") { throw "manifest version $($x.Package.Identity.Version) is not ${{ needs.verify.outputs.numeric }}.0" }
          dotnet build src/${{ matrix.project }} -c Release -p:Platform=x64 -p:BuildMsix=true -p:AunProd=${{ needs.verify.outputs.prod }} `
            -p:Version=${{ needs.verify.outputs.numeric }} -p:InformationalVersion=${{ needs.verify.outputs.version }} `
            -p:AppxPackageDir="$((Get-Location).Path)\out\msix\\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed" }
          $msix = Get-ChildItem out/msix -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "no MSIX produced" }
          New-Item -ItemType Directory -Force msix | Out-Null
          Copy-Item $msix.FullName "msix/${{ matrix.package }}-${{ needs.verify.outputs.version }}-x64-unsigned.msix"
          Get-ChildItem msix
      - name: Signed MSIX for direct download
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX -or -not $env:PFX_PASSWORD) {
            Write-Output "::notice::${{ matrix.product }} MSIX is not signed: WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD are not set (docs/RELEASE.md). The unsigned MSIX is in the msix-${{ matrix.package }} artifact."
            exit 0
          }
          $kits = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          $pfx = Join-Path $env:RUNNER_TEMP "windows-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          try {
            # A sideloaded MSIX must name the certificate's subject as its publisher; the Store copy keeps the
            # Partner Center publisher and needs no certificate (the Store signs it).
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:PFX_PASSWORD)
            $src = (Resolve-Path "msix/${{ matrix.package }}-${{ needs.verify.outputs.version }}-x64-unsigned.msix").Path
            $dir = Join-Path $env:RUNNER_TEMP "msix-unpacked"
            & "$($kits.FullName)\makeappx.exe" unpack /p $src /d $dir /o | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed" }
            $manifest = Join-Path $dir "AppxManifest.xml"
            [xml]$x = Get-Content -Encoding utf8 $manifest
            $x.Package.Identity.Publisher = $cert.Subject
            $x.Save($manifest)
            New-Item -ItemType Directory -Force dist | Out-Null
            $out = "dist/${{ matrix.package }}-${{ needs.verify.outputs.version }}-x64.msix"
            & "$($kits.FullName)\makeappx.exe" pack /d $dir /p $out /o | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }
            & "$($kits.FullName)\signtool.exe" sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $out
            if ($LASTEXITCODE -ne 0) { throw "signing failed" }
            & "$($kits.FullName)\signtool.exe" verify /pa $out
            if ($LASTEXITCODE -ne 0) { throw "signature does not verify" }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.package }}
          path: msix/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.smoke
        with:
          name: smoke-${{ matrix.package }}
          path: smoke
          if-no-files-found: ignore

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: AlUmmahNow.Studio.Linux
            appid: net.alummahnow.Studio
            package: AlUmmahNow-Studio-Linux
            deb: alummahnow-studio
            exe: alummahnow-studio
            description: Al Ummah Now Studio - upload and manage your channel's videos
            smoke: true
          - project: AlUmmahNow.Linux
            appid: net.alummahnow.AlUmmahNow
            package: AlUmmahNow-Linux
            deb: alummahnow
            exe: alummahnow
            description: Al Ummah Now - watch Islamic videos
            smoke: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        run: ./scripts/fetch-core.sh
      - uses: ./.github/actions/apt-install
        with:
          packages: flatpak flatpak-builder
      - name: Publish self-contained
        run: dotnet publish src/${{ matrix.project }} -c Release -r linux-x64 --self-contained -p:AunProd=${{ needs.verify.outputs.prod }} -p:Version=${{ needs.verify.outputs.numeric }} -p:InformationalVersion=${{ needs.verify.outputs.version }} -o artifacts/flatpak-input/publish
      - name: Debian package
        run: |
          scripts/build-deb.sh artifacts/flatpak-input/publish ${{ matrix.deb }} ${{ needs.verify.outputs.version }} ${{ matrix.appid }} ${{ matrix.exe }} \
            packaging/flatpak/${{ matrix.appid }}.desktop src/AlUmmahNow.Studio.Windows/Assets/Square150x150Logo.png "${{ matrix.description }}" dist
      # The built .deb with its dependencies, and the smoke test's display tools
      - name: Install the .deb
        if: matrix.smoke
        uses: ./.github/actions/apt-install
        with:
          packages: ./dist/${{ matrix.deb }}_*.deb xvfb imagemagick openbox
      - name: Launch the installed app
        if: matrix.smoke
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          test -x /usr/bin/${{ matrix.exe }}
          test -f /usr/share/applications/${{ matrix.appid }}.desktop
          mkdir -p smoke
          export AUN_DEMO=1 AUN_AUTOMATION=shell AUN_EXIT_AFTER=15 AUN_LANG=en XDG_CONFIG_HOME=$(mktemp -d) XDG_STATE_HOME=$(mktemp -d)
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c 'openbox & sleep 2; (sleep 10; import -window root smoke/installed.png) & ${{ matrix.exe }}' 2>&1 | tee smoke/installed.log || true
          grep -q 'RESULT PASS' smoke/installed.log
          sudo dpkg --remove ${{ matrix.deb }}
          test ! -e /usr/bin/${{ matrix.exe }}
      - name: Build Flatpak bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=flatpak-repo build-dir packaging/flatpak/${{ matrix.appid }}.yml
          flatpak build-bundle flatpak-repo "dist/${{ matrix.package }}-${{ needs.verify.outputs.version }}-x86_64.flatpak" ${{ matrix.appid }} --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.smoke
        with:
          name: smoke-${{ matrix.package }}
          path: smoke
          if-no-files-found: ignore

  tizen:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Stamp version
        run: python3 scripts/stamp-version.py ${{ needs.verify.outputs.numeric }}
      - name: Build unsigned TPK
        run: dotnet build src/AlUmmahNow.Tizen -c Release -p:AunProd=${{ needs.verify.outputs.prod }} -p:Version=${{ needs.verify.outputs.numeric }}
      - name: Collect
        run: |
          mkdir -p out
          tpk=$(find src/AlUmmahNow.Tizen/bin -name '*.tpk' | head -1)
          test -n "$tpk"
          cp "$tpk" "out/AlUmmahNow-Tizen-${{ needs.verify.outputs.version }}-unsigned.tpk"
      - name: Samsung-signed TPK
        env:
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          missing=""
          for n in AUTHOR_P12 AUTHOR_PASSWORD DISTRIBUTOR_P12 DISTRIBUTOR_PASSWORD; do [ -n "${!n}" ] || missing="$missing TIZEN_$n"; done
          missing="${missing//_P12/_P12_BASE64}"
          if [ -n "$missing" ]; then
            echo "::notice::Tizen TPK is not Samsung-signed: missing$missing (docs/RELEASE.md)"
            exit 0
          fi
          certs="$RUNNER_TEMP/tizen-certs"; mkdir -p "$certs"
          trap 'rm -rf "$certs"' EXIT
          echo "$AUTHOR_P12" | base64 -d > "$certs/author.p12"
          echo "$DISTRIBUTOR_P12" | base64 -d > "$certs/distributor.p12"
          rm -rf src/AlUmmahNow.Tizen/bin src/AlUmmahNow.Tizen/obj
          dotnet build src/AlUmmahNow.Tizen -c Release -p:AunProd=${{ needs.verify.outputs.prod }} -p:Version=${{ needs.verify.outputs.numeric }} \
            "-p:AuthorPath=$certs/author.p12" "-p:AuthorPass=$AUTHOR_PASSWORD" \
            "-p:DistributorPath=$certs/distributor.p12" "-p:DistributorPass=$DISTRIBUTOR_PASSWORD"
          tpk=$(find src/AlUmmahNow.Tizen/bin -name '*.tpk' | head -1)
          test -n "$tpk"
          cp "$tpk" "out/AlUmmahNow-Tizen-${{ needs.verify.outputs.version }}.tpk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-AlUmmahNow-Tizen
          path: out/*
          if-no-files-found: error

  msstore:
    # Puts each Windows app's MSIX and its listing (store/microsoft/) into a Partner Center draft
    # submission. Full releases only; dry runs check the listing files and stop.
    needs: [verify, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: viewer
            key: VIEWER
            package: AlUmmahNow-Windows
          - app: studio
            key: STUDIO
            package: AlUmmahNow-Studio-Windows
    steps:
      - uses: actions/checkout@v4
      - name: Listing files
        shell: pwsh
        env:
          MSSTORE_PRIVACY_POLICY_URL: ${{ vars.MSSTORE_PRIVACY_POLICY_URL }}
        run: |
          python scripts/store-listing.py ${{ matrix.app }} > "$env:RUNNER_TEMP/listing.json"
          if ($LASTEXITCODE -ne 0) { throw "listing files are invalid" }
          Get-Content "$env:RUNNER_TEMP/listing.json" -Raw | ConvertFrom-Json | Out-Null
      - name: Owner values
        id: gate
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars[format('MSSTORE_{0}_PRODUCT_ID', matrix.key)] }}
          PACKAGE_NAME: ${{ vars[format('WINDOWS_{0}_PACKAGE_NAME', matrix.key)] || secrets[format('WINDOWS_{0}_PACKAGE_NAME', matrix.key)] }}
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER || secrets.WINDOWS_PUBLISHER }}
        run: |
          $names = [ordered]@{
            MSSTORE_TENANT_ID = $env:MSSTORE_TENANT_ID; MSSTORE_SELLER_ID = $env:MSSTORE_SELLER_ID
            MSSTORE_CLIENT_ID = $env:MSSTORE_CLIENT_ID; MSSTORE_CLIENT_SECRET = $env:MSSTORE_CLIENT_SECRET
            "MSSTORE_${{ matrix.key }}_PRODUCT_ID" = $env:PRODUCT_ID
            "WINDOWS_${{ matrix.key }}_PACKAGE_NAME" = $env:PACKAGE_NAME; WINDOWS_PUBLISHER = $env:PUBLISHER
          }
          $missing = @($names.Keys | Where-Object { -not $names[$_] })
          if ("${{ github.event_name }}" -ne "push" -or "${{ needs.verify.outputs.prod }}" -ne "true") {
            Write-Output "::notice::Microsoft Store (${{ matrix.app }}): dry run or pre-release, nothing uploaded. Listing files are valid."
            "ready=false" >> $env:GITHUB_OUTPUT
          } elseif ($missing.Count -gt 0) {
            Write-Output "::notice::Microsoft Store upload skipped for ${{ matrix.app }}: missing $($missing -join ', ') (docs/RELEASE.md)"
            "ready=false" >> $env:GITHUB_OUTPUT
          } else {
            "ready=true" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: msix-${{ matrix.package }}
          path: msix
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: steps.gate.outputs.ready == 'true'
      - name: Upload to a draft submission
        if: steps.gate.outputs.ready == 'true'
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars[format('MSSTORE_{0}_PRODUCT_ID', matrix.key)] }}
          COMMIT: ${{ vars.MSSTORE_COMMIT }}
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }
          $msix = (Get-ChildItem msix -Filter *.msix | Select-Object -First 1).FullName
          # Package first: publish discards staged metadata edits.
          msstore publish $msix -id $env:PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }
          $raw = (msstore submission get $env:PRODUCT_ID | Out-String)
          $sub = $raw.Substring($raw.IndexOf('{'), $raw.LastIndexOf('}') - $raw.IndexOf('{') + 1) | ConvertFrom-Json
          $listing = Get-Content "$env:RUNNER_TEMP/listing.json" -Raw | ConvertFrom-Json
          $listingsProp = $sub.PSObject.Properties["listings"]
          if (-not $listingsProp) { $sub | Add-Member -NotePropertyName listings -NotePropertyValue ([pscustomobject]@{}); $listingsProp = $sub.PSObject.Properties["listings"] }
          foreach ($lang in $listing.PSObject.Properties) {
            $entry = $listingsProp.Value.PSObject.Properties[$lang.Name]
            if (-not $entry) { $listingsProp.Value | Add-Member -NotePropertyName $lang.Name -NotePropertyValue ([pscustomobject]@{ baseListing = [pscustomobject]@{} }); $entry = $listingsProp.Value.PSObject.Properties[$lang.Name] }
            $base = $entry.Value.PSObject.Properties["baseListing"]
            if (-not $base) { $entry.Value | Add-Member -NotePropertyName baseListing -NotePropertyValue ([pscustomobject]@{}); $base = $entry.Value.PSObject.Properties["baseListing"] }
            foreach ($field in $lang.Value.PSObject.Properties) {
              # Keep Partner Center's own key casing when the field already exists.
              $existing = $base.Value.PSObject.Properties[$field.Name]
              if ($existing) { $existing.Value = $field.Value } else { $base.Value | Add-Member -NotePropertyName $field.Name -NotePropertyValue $field.Value }
            }
          }
          msstore submission update $env:PRODUCT_ID ($sub | ConvertTo-Json -Depth 100 -Compress)
          if ($LASTEXITCODE -ne 0) { throw "msstore submission update failed" }
          if ($env:COMMIT -eq "true") {
            msstore submission publish $env:PRODUCT_ID
            if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed" }
            Write-Output "::notice::Microsoft Store (${{ matrix.app }}): submitted for certification."
          } else {
            Write-Output "::notice::Microsoft Store (${{ matrix.app }}): draft submission ready in Partner Center. Review and submit it there, or set MSSTORE_COMMIT=true."
          }

  release:
    # Dry runs stop after the builds above.
    if: github.event_name == 'push'
    needs: [verify, windows, linux, tizen]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: python3 scripts/release-notes.py "$VERSION" "$PRERELEASE" > notes.md && cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.verify.outputs.prerelease }}" = true ]; then mode=--prerelease; else mode=--draft; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" $mode --verify-tag --notes-file notes.md --title "$GITHUB_REF_NAME"
