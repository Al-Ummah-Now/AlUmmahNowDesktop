name: CI Studio Windows
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-studio-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  studio-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Enable Media Foundation (optional feature on Windows Server)
        run: Install-WindowsFeature Server-Media-Foundation | Format-List
      - name: Install ffmpeg to generate a source clip
        run: choco install ffmpeg -y --no-progress
      - name: Build Studio
        run: dotnet build src/AlUmmahNow.Studio.Windows -c Release -p:Platform=x64
      - name: Run Studio scenarios
        shell: pwsh
        run: |
          $out = (New-Item -ItemType Directory -Force artifacts/studio).FullName
          $watch = (New-Item -ItemType Directory -Force watched).FullName
          [IO.File]::WriteAllBytes("$watch/lecture-one.mp4", (New-Object byte[] 2000000))
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=duration=5:size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=5 -c:v libx264 -pix_fmt yuv420p -c:a aac source.mp4
          $source = (Resolve-Path source.mp4).Path
          $exe = (Resolve-Path "src/AlUmmahNow.Studio.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNowStudio.exe").Path
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads "" uploads-ar $out $watch
          ./scripts/windows-studio-scenario.ps1 $exe ar timeline "" signin-ar $out "" "" 0
          ./scripts/windows-studio-scenario.ps1 $exe en timeline "" signin-en $out "" "" 0
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell shell-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell shell-en $out
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell accounts-en $out "" accounts
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell signout-ar $out "" signout
          $stage = (New-Item -ItemType Directory -Force staged).FullName
          foreach ($n in "درس 1.mp4","درس 2.mp4","lesson 10.mp4") { [IO.File]::WriteAllBytes("$stage/$n", (New-Object byte[] 1500000)) }
          $env:AUN_STAGE_DIR = $stage
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell upload-staged-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell upload-staged-en $out
          $env:AUN_STAGE_DIR = ""
          ./scripts/windows-studio-scenario.ps1 $exe ar videos shell videos-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en videos shell videos-en $out
          ./scripts/windows-studio-scenario.ps1 $exe ar videos shell search-ar $out "" search
          ./scripts/windows-studio-scenario.ps1 $exe en videos shell edit-en $out "" edit
          ./scripts/windows-studio-scenario.ps1 $exe ar videos shell bulk-ar $out "" bulk
          ./scripts/windows-studio-scenario.ps1 $exe en videos shell delete-en $out "" delete
          ./scripts/windows-studio-scenario.ps1 $exe ar analytics shell analytics-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en analytics shell analytics-en $out
          ./scripts/windows-studio-scenario.ps1 $exe ar timeline "" timeline-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en encode "encode:$source" encode-en $out
          foreach ($n in "uploads-ar","signin-ar","signin-en","shell-ar","shell-en","accounts-en","signout-ar","upload-staged-ar","upload-staged-en","videos-ar","videos-en","search-ar","edit-en","bulk-ar","delete-en","analytics-ar","analytics-en","timeline-ar","encode-en") {
            if (-not (Select-String -Quiet "RESULT PASS" "artifacts/studio/$n.txt")) { throw "$n failed" }
            if (Test-Path "artifacts/studio/$n.txt.hang.txt") { throw "$n did not exit" }
          }
          # Screen readers: the sign-in button, channel picker and account menu are named.
          if (-not (Select-String -Quiet "`tSignIn`t" artifacts/studio/signin-en.uia.txt)) { throw "sign-in button not exposed to UI Automation" }
          if (-not (Select-String -Quiet "`tChannelPicker`tChannel" artifacts/studio/shell-en.uia.txt)) { throw "channel picker has no accessible name" }
          if (-not (Select-String -Quiet "`tAccountMenu`tAccount: Amina Studio" artifacts/studio/shell-en.uia.txt)) { throw "account menu has no accessible name" }
          if (-not (Select-String -Quiet "Sign out of" artifacts/studio/accounts-en.uia.txt)) { throw "account menu items not exposed" }
          if (-not (Select-String -Quiet "`tVideoSearch`tSearch your videos" artifacts/studio/videos-en.uia.txt)) { throw "video search has no accessible name" }
          if (-not (Select-String -Quiet "Select Seerah" artifacts/studio/videos-en.uia.txt)) { throw "row checkboxes have no accessible names" }
          if (-not (Select-String -Quiet "`tStartUpload`tUpload 3 videos" artifacts/studio/upload-staged-en.uia.txt)) { throw "upload button not exposed" }
          ffmpeg -hide_banner -i "$source.out.mp4" 2>&1 | Select-String "Video:|Duration" | Tee-Object artifacts/studio/discover.txt
          if (-not (Select-String -Quiet "h264" artifacts/studio/discover.txt)) { throw "output is not H.264" }
          # ffmpeg -i with no output file always exits 1; the checks above are the gate.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-windows
          path: artifacts/studio
