name: CI Studio Windows
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-studio-windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  studio-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Enable Media Foundation (optional feature on Windows Server)
        run: Install-WindowsFeature Server-Media-Foundation | Format-List
      - name: Install ffmpeg to generate a source clip
        shell: pwsh
        run: ./scripts/install-ffmpeg.ps1
      - name: Native passkeys (webauthn.dll) - struct layout against the SDK header, unit tests
        shell: pwsh
        run: |
          ./scripts/webauthn-layout.ps1 "$env:RUNNER_TEMP/webauthn-layout.txt"
          $env:AUN_WEBAUTHN_LAYOUT = "$env:RUNNER_TEMP/webauthn-layout.txt"
          dotnet test tests/AlUmmahNow.Platform.Windows.Tests -c Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "passkey tests failed" }
      - name: Build Studio
        run: dotnet build src/AlUmmahNow.Studio.Windows -c Release -p:Platform=x64
      - name: Run Studio scenarios
        env:
          AUN_DEMO_TODAY: "2026-11-21"  # one demo "today" for every frame (DemoClock)
        shell: pwsh
        run: |
          $out = (New-Item -ItemType Directory -Force artifacts/studio).FullName
          $watch = (New-Item -ItemType Directory -Force watched).FullName
          [IO.File]::WriteAllBytes("$watch/lecture-one.mp4", (New-Object byte[] 2000000))
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=duration=5:size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=5 -c:v libx264 -pix_fmt yuv420p -c:a aac source.mp4
          $source = (Resolve-Path source.mp4).Path
          $exe = (Resolve-Path "src/AlUmmahNow.Studio.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNowStudio.exe").Path
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads "" uploads-ar $out $watch
          ./scripts/windows-studio-scenario.ps1 $exe ar timeline "" signin-ar $out "" "" 0
          ./scripts/windows-studio-scenario.ps1 $exe en timeline "" signin-en $out "" "" 0
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell shell-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell shell-en $out
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell accounts-en $out "" accounts
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell channels-en $out "" channels
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell channels-ar $out "" channels
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell signout-ar $out "" signout
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell addpasskey-en $out "" addpasskey
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell addpasskey-ar $out "" addpasskey
          $stage = (New-Item -ItemType Directory -Force staged).FullName
          foreach ($n in "درس 1.mp4","درس 2.mp4","lesson 10.mp4") { [IO.File]::WriteAllBytes("$stage/$n", (New-Object byte[] 1500000)) }
          $env:AUN_STAGE_DIR = $stage
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell upload-staged-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell upload-staged-en $out
          $env:AUN_STAGE_DIR = ""
          ./scripts/windows-studio-scenario.ps1 $exe ar videos shell videos-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en videos shell videos-en $out
          ./scripts/windows-studio-scenario.ps1 $exe ar videos shell search-ar $out "" search
          ./scripts/windows-studio-scenario.ps1 $exe en videos shell edit-en $out "" edit
          ./scripts/windows-studio-scenario.ps1 $exe ar videos shell bulk-ar $out "" bulk
          ./scripts/windows-studio-scenario.ps1 $exe en videos shell delete-en $out "" delete
          ./scripts/windows-studio-scenario.ps1 $exe ar analytics shell analytics-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en analytics shell analytics-en $out
          ./scripts/windows-studio-scenario.ps1 $exe ar timeline "" timeline-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en encode "encode:$source" encode-en $out
          # Hidden when off (owner rule 2026-11-16): no upload in the tier and analytics feature_off leave no tab.
          $env:AUN_DEMO_FEATURES_OFF = "upload,analytics,bulkSchedule"
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell features-off-en $out
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell features-off-ar $out
          $env:AUN_DEMO_FEATURES_OFF = ""
          foreach ($n in "features-off-en","features-off-ar") {
            if (-not (Select-String -Quiet -SimpleMatch "page=videos upload=False analytics=False bulkSchedule=False" "artifacts/studio/$n.txt")) { throw "$n still shows Upload or Analytics" }
            if (Select-String -Quiet -SimpleMatch "`tPage_uploads`t" "artifacts/studio/$n.uia.txt") { throw "$n exposes the Upload tab" }
            if (Select-String -Quiet -SimpleMatch "`tPage_analytics`t" "artifacts/studio/$n.uia.txt") { throw "$n exposes the Analytics tab" }
          }
          if (-not (Select-String -Quiet -SimpleMatch "page=uploads upload=True analytics=True bulkSchedule=True" "artifacts/studio/shell-en.txt")) { throw "shell-en lost Upload or Analytics" }
          if (-not (Select-String -Quiet -SimpleMatch "`tPage_uploads`t" "artifacts/studio/shell-en.uia.txt")) { throw "shell-en has no Upload tab" }
          foreach ($n in "features-off-en","features-off-ar","uploads-ar","signin-ar","signin-en","shell-ar","shell-en","accounts-en","channels-en","channels-ar","signout-ar","addpasskey-en","addpasskey-ar","upload-staged-ar","upload-staged-en","videos-ar","videos-en","search-ar","edit-en","bulk-ar","delete-en","analytics-ar","analytics-en","timeline-ar","encode-en") {
            if (-not (Select-String -Quiet "RESULT PASS" "artifacts/studio/$n.txt")) { throw "$n failed" }
            if (Test-Path "artifacts/studio/$n.txt.hang.txt") { throw "$n did not exit" }
          }
          # Days in US order, as on the web.
          if (-not (Select-String -Quiet -SimpleMatch "from Oct 25 to Nov 21" artifacts/studio/analytics-en.uia.txt)) { throw "the chart's days are not in US order" }
          # Screen readers: the sign-in button and the identity menu (channels and people) are named.
          if (-not (Select-String -Quiet "`tSignIn`t" artifacts/studio/signin-en.uia.txt)) { throw "sign-in button not exposed to UI Automation" }
          # Native passkeys (webauthn.dll): passkey first, the browser sign-in one click away.
          Get-Content artifacts/studio/signin-en.txt
          if (-not (Select-String -Quiet -SimpleMatch "`tSignInPasskey`tSign in with a passkey" artifacts/studio/signin-en.uia.txt)) { throw "passkey sign-in button not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "`tSignIn`tSign in another way" artifacts/studio/signin-en.uia.txt)) { throw "'Sign in another way' not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "`tSignInPasskey`tالدخول بمفتاح المرور" artifacts/studio/signin-ar.uia.txt)) { throw "Arabic passkey button not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "`tAddPasskey`tAdd a passkey" artifacts/studio/accounts-en.uia.txt)) { throw "'Add a passkey' not in the account menu" }
          if (-not (Select-String -Quiet -SimpleMatch "Passkey added" artifacts/studio/addpasskey-en.uia.txt)) { throw "no 'Passkey added' dialog" }
          if (-not (Select-String -Quiet -SimpleMatch "أُضيف مفتاح المرور" artifacts/studio/addpasskey-ar.uia.txt)) { throw "no Arabic 'Passkey added' dialog" }
          if (-not (Select-String -Quiet "`tIdentityMenu`tActing as" artifacts/studio/shell-en.uia.txt)) { throw "the identity menu has no accessible name" }
          # Studio opens at rest, as the web: the header search never takes focus on its own.
          foreach ($n in "shell-en","shell-ar") { if (-not (Select-String -Quiet -SimpleMatch "searchFocused=False" "artifacts/studio/$n.txt")) { throw "$n opened with focus in the header search" } }
          # No text field at all on open, on any page (the Videos page has its own search field).
          foreach ($n in "shell-en","shell-ar","videos-en","videos-ar") { if (-not (Select-String -Quiet -SimpleMatch "fieldFocused=False" "artifacts/studio/$n.txt")) { throw "$n opened with focus in a text field" } }
          if (-not (Select-String -Quiet -SimpleMatch "Masjid Media Team · Channel · Editor" artifacts/studio/channels-en.uia.txt)) { throw "channel options are not tagged 'Channel'" }
          if (-not (Select-String -Quiet -SimpleMatch "فريق إعلام المسجد، قناة، محرّر" artifacts/studio/channels-ar.uia.txt)) { throw "Arabic channel options are not tagged «قناة»" }
          if (-not (Select-String -Quiet -SimpleMatch "Switch to Amina Studio" artifacts/studio/accounts-en.uia.txt)) { throw "people are not in the identity menu" }
          if (-not (Select-String -Quiet "Sign out of" artifacts/studio/accounts-en.uia.txt)) { throw "account menu items not exposed" }
          if (-not (Select-String -Quiet "`tVideoSearch`tSearch your videos" artifacts/studio/videos-en.uia.txt)) { throw "video search has no accessible name" }
          if (-not (Select-String -Quiet "Select Seerah" artifacts/studio/videos-en.uia.txt)) { throw "row checkboxes have no accessible names" }
          if (-not (Select-String -Quiet "`tStartUpload`tUpload 3 videos" artifacts/studio/upload-staged-en.uia.txt)) { throw "upload button not exposed" }
          ffmpeg -hide_banner -i "$source.out.mp4" 2>&1 | Select-String "Video:|Duration" | Tee-Object artifacts/studio/discover.txt
          if (-not (Select-String -Quiet "h264" artifacts/studio/discover.txt)) { throw "output is not H.264" }
          # ffmpeg -i with no output file always exits 1; the checks above are the gate.
          exit 0
      - name: Lantern Glass review frames (the window only; en/ar, Light/Dark; 1440x900 with the identity menu closed and open, 1920 and the 1024 minimum)
        env:
          AUN_DEMO_TODAY: "2026-11-21"  # one demo "today" for every frame (DemoClock)
        shell: pwsh
        run: |
          # The runner's screen is 1024x768: too small for the windows.
          ./scripts/set-resolution.ps1 1920 1080
          $out = (New-Item -ItemType Directory -Force artifacts/review).FullName
          $exe = (Resolve-Path "src/AlUmmahNow.Studio.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNowStudio.exe").Path
          # Upload with three staged files and two watched ones uploading (simulated), so every card shows.
          $stage = (New-Item -ItemType Directory -Force review-staged).FullName
          foreach ($n in "خطبة 1.mp4","خطبة 2.mp4","khutbah 10.mp4") { [IO.File]::WriteAllBytes("$stage/$n", (New-Object byte[] 1500000)) }
          # As on someone's own computer: the pages show the folder's path.
          $watch = (New-Item -ItemType Directory -Force "C:\Videos\New").FullName
          foreach ($n in "friday-khutbah.mp4","seerah-part-4.mov") { [IO.File]::WriteAllBytes("$watch/$n", (New-Object byte[] 2000000)) }
          $env:AUN_STAGE_DIR = $stage; $env:AUN_WATCH_DIR = $watch
          # Title-card thumbnails in the frame's language, as on Linux.
          $env:AUN_DEMO_THUMBS = (Resolve-Path tests/fixtures/studio-thumbs).Path
          $failed = @()
          foreach ($lang in "en","ar") { foreach ($theme in "dark","light") {
            foreach ($shot in @(@("uploads","","1440x900"), @("uploads","channels","1440x900"), @("uploads","","1920x1032"), @("uploads","","1024x700"), @("uploads","scheduled","1440x900"), @("videos","","1440x900"), @("videos","bulk","1440x900"), @("videos","private","1440x900"), @("videos","deleted","1440x900"), @("videos","deleted-open","1440x900"), @("videos","searchfocus","1440x900"), @("videos","searchhover","1440x900"), @("videos","","1920x1032"), @("videos","","1024x700"), @("analytics","","1440x900"), @("analytics","cardhover","1440x900"), @("analytics","","1920x1032"), @("analytics","","1024x700"), @("timeline","","1440x900"), @("encode","","1440x900"), @("encode","active","1440x900"), @("timeline","","1024x700"), @("settings","","1440x900"), @("settings","","1024x700"))) {
              $state = if ($shot[1]) { $shot[1] } else { "closed" }
              $name = "windows-$($shot[0])-$state-$lang-$theme-$($shot[2])"
              ./scripts/windows-studio-shot.ps1 $exe $lang $theme $shot[2] $shot[1] $name $out $shot[0]
              if (-not (Select-String -Quiet "RESULT PASS" "$out/$name.txt")) { $failed += $name }
            }
          } }
          foreach ($lang in "en","ar") { foreach ($scene in "search","edit","delete") {
            $name = "windows-videos-$scene-$lang-dark-1440x900"
            ./scripts/windows-studio-shot.ps1 $exe $lang dark 1440x900 $scene $name $out videos
            if (-not (Select-String -Quiet "RESULT PASS" "$out/$name.txt")) { $failed += $name }
          } }
          foreach ($lang in "en","ar") { foreach ($scene in "edit","delete") {
            $name = "windows-videos-$scene-$lang-light-1440x900"
            ./scripts/windows-studio-shot.ps1 $exe $lang light 1440x900 $scene $name $out videos
            if (-not (Select-String -Quiet "RESULT PASS" "$out/$name.txt")) { $failed += $name }
          } }
          # A channel and accounts with a picture of their own.
          foreach ($lang in "en","ar") {
            $name = "windows-settings-avatar-$lang-dark-1440x900"
            ./scripts/windows-studio-shot.ps1 $exe $lang dark 1440x900 avatar $name $out settings
            if (-not (Select-String -Quiet "RESULT PASS" "$out/$name.txt")) { $failed += $name }
          }
          foreach ($lang in "en","ar") { foreach ($theme in "dark","light") {
            # Signed out: the sign-in card.
            $name = "windows-signin-closed-$lang-$theme-1440x900"
            ./scripts/windows-studio-shot.ps1 $exe $lang $theme 1440x900 "" $name $out timeline 0
            if (-not (Select-String -Quiet "RESULT PASS" "$out/$name.txt")) { $failed += $name }
          } }
          # High contrast, last, and off again. First turned on while Studio runs, then before it starts; each passes only
          # when Studio itself is in it and its brushes are the system's colors. The runner can do it: not on is a failure.
          $name = "windows-videos-highcontrastswitch-en-dark-1440x900"
          ./scripts/windows-studio-shot.ps1 $exe en dark 1440x900 highcontrastswitch $name $out videos
          if (Select-String -Quiet "on=True" "$out/high-contrast.txt") {
            if (-not (Select-String -Quiet "RESULT PASS" "$out/$name.txt")) { $failed += $name }
            foreach ($lang in "en","ar") { foreach ($tab in "videos","timeline","analytics") {
              $name = "windows-$tab-highcontrast-$lang-dark-1440x900"
              ./scripts/windows-studio-shot.ps1 $exe $lang dark 1440x900 highcontrast $name $out $tab
              if (-not (Select-String -Quiet "RESULT PASS" "$out/$name.txt")) { $failed += $name }
            } }
          } else { $failed += "high contrast was not turned on: $(Get-Content $out/high-contrast.txt)" }
          ./scripts/high-contrast.ps1 off
          if ($failed.Count -gt 0) { throw "shots failed: $failed" }
          # The chart's 28 bars are seen on the light card: both edges of each, as drawn.
          foreach ($lang in "en","ar") { ./scripts/windows-edges-in-row.ps1 "$out/windows-analytics-closed-$lang-light-1440x900.png" 619 $(if ($lang -eq "en") { 358 } else { 442 }) $(if ($lang -eq "en") { 980 } else { 1064 }) 3 56 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-windows-review
          path: |
            artifacts/review/*.png
            artifacts/review/*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-windows
          path: artifacts/studio
