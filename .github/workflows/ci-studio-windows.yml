name: CI Studio Windows
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-studio-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  studio-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Enable Media Foundation (optional feature on Windows Server)
        run: Install-WindowsFeature Server-Media-Foundation | Format-List
      - name: Install ffmpeg to generate a source clip
        run: choco install ffmpeg -y --no-progress
      - name: Native passkeys (webauthn.dll) - struct layout against the SDK header, unit tests
        shell: pwsh
        run: |
          ./scripts/webauthn-layout.ps1 "$env:RUNNER_TEMP/webauthn-layout.txt"
          $env:AUN_WEBAUTHN_LAYOUT = "$env:RUNNER_TEMP/webauthn-layout.txt"
          dotnet test tests/AlUmmahNow.Platform.Windows.Tests -c Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "passkey tests failed" }
      - name: Build Studio
        run: dotnet build src/AlUmmahNow.Studio.Windows -c Release -p:Platform=x64
      - name: Run Studio scenarios
        shell: pwsh
        run: |
          # Room for a 1280x800 window like the Linux captures; if the runner refuses, the app maximises instead.
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "display resolution unchanged: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "screen $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          $out = (New-Item -ItemType Directory -Force artifacts/studio).FullName
          $watch = (New-Item -ItemType Directory -Force watched).FullName
          [IO.File]::WriteAllBytes("$watch/talk-one.mp4", (New-Object byte[] 2000000))
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=duration=5:size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=5 -c:v libx264 -pix_fmt yuv420p -c:a aac source.mp4
          $source = (Resolve-Path source.mp4).Path
          # Editor sources: an English and an Arabic file name, so clip labels are checked in both directions.
          $editor = (New-Item -ItemType Directory -Force editor).FullName
          Copy-Item source.mp4 "$editor/opening.mp4"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=duration=3:size=640x360:rate=30 -f lavfi -i sine=frequency=660:duration=3 -c:v libx264 -pix_fmt yuv420p -c:a aac "$editor/سوق دمشق.mp4"
          $env:AUN_EDITOR_FILES = "$editor/opening.mp4|$editor/سوق دمشق.mp4"
          $exe = (Resolve-Path "src/AlUmmahNow.Studio.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNowStudio.exe").Path
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads "" uploads-ar $out $watch
          ./scripts/windows-studio-scenario.ps1 $exe ar timeline "" signin-ar $out "" "" 0
          ./scripts/windows-studio-scenario.ps1 $exe en timeline "" signin-en $out "" "" 0
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell shell-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell shell-en $out
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell accounts-en $out "" accounts
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell signout-ar $out "" signout
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell addpasskey-en $out "" addpasskey
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell addpasskey-ar $out "" addpasskey
          $stage = (New-Item -ItemType Directory -Force staged).FullName
          foreach ($n in "مرئي 1.mp4","مرئي 2.mp4","video 10.mp4") { [IO.File]::WriteAllBytes("$stage/$n", (New-Object byte[] 1500000)) }
          $env:AUN_STAGE_DIR = $stage
          ./scripts/windows-studio-scenario.ps1 $exe ar uploads shell upload-staged-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en uploads shell upload-staged-en $out
          $env:AUN_STAGE_DIR = ""
          ./scripts/windows-studio-scenario.ps1 $exe ar videos shell videos-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en videos shell videos-en $out
          ./scripts/windows-studio-scenario.ps1 $exe ar videos shell search-ar $out "" search
          ./scripts/windows-studio-scenario.ps1 $exe en videos shell edit-en $out "" edit
          ./scripts/windows-studio-scenario.ps1 $exe ar videos shell bulk-ar $out "" bulk
          ./scripts/windows-studio-scenario.ps1 $exe en videos shell delete-en $out "" delete
          ./scripts/windows-studio-scenario.ps1 $exe ar timeline "" timeline-ar $out
          ./scripts/windows-studio-scenario.ps1 $exe en encode "encode:$source" encode-en $out
          # Studio screens (E19): every screen in both languages, dark and light.
          $screens = @()
          foreach ($theme in "dark","light") {
            $env:AUN_THEME = $theme
            foreach ($lang in "ar","en") {
              $runs = @(@("captions","captions",""), @("captions-editor","captions","captions-editor"), @("analytics","analytics",""), @("analytics-video","analytics","analytics-video"), @("brand","brand",""), @("brand-team","brand","brand-team"), @("preencode","uploads","preencode"))
              foreach ($r in $runs) {
                $n = "$($r[0])-$lang-$theme"
                if ($r[2] -eq "preencode") { $env:AUN_STAGE_DIR = $stage }
                ./scripts/windows-studio-scenario.ps1 $exe $lang $r[1] shell $n $out "" $r[2]
                $env:AUN_STAGE_DIR = ""
                $screens += $n
              }
            }
          }
          # Editor (19.5): the cut timeline in both languages and themes.
          foreach ($theme in "dark","light") {
            $env:AUN_THEME = $theme
            foreach ($lang in "ar","en") {
              $n = "editor-$lang-$theme"
              ./scripts/windows-studio-scenario.ps1 $exe $lang timeline "" $n $out "" editor
              $screens += $n
              # Titles (19.5 + 19.9): a bilingual lower third in the demo brand kit's look and a centred title.
              $n = "editor-titles-$lang-$theme"
              ./scripts/windows-studio-scenario.ps1 $exe $lang timeline "" $n $out "" editor-titles
              $screens += $n
            }
          }
          $env:AUN_THEME = ""
          # A real MediaComposition export of the cut, and a real pre-encode (Media Foundation per rung, Core packaging).
          $env:AUN_EXIT_AFTER_SECS = "70"
          $env:AUN_EXPORT_TO = Join-Path (Get-Location) "edited.mp4"
          ./scripts/windows-studio-scenario.ps1 $exe en timeline export editor-export-en $out "" editor
          # A titled export: the app checks the lower third's box colour in the exported picture.
          $env:AUN_EXIT_AFTER_SECS = "80"
          $env:AUN_EXPORT_TO = Join-Path (Get-Location) "titled.mp4"
          ./scripts/windows-studio-scenario.ps1 $exe ar timeline export editor-titles-export-ar $out "" editor-titles
          if (Test-Path "artifacts/studio/editor-titles-export-ar.txt.titles.txt") { Get-Content "artifacts/studio/editor-titles-export-ar.txt.titles.txt" }
          $env:AUN_EXPORT_TO = ""
          $real = (New-Item -ItemType Directory -Force real).FullName
          # Big enough (about 15 MB) that the simulated upload is still running when the pre-encode starts.
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=duration=20:size=1280x720:rate=30 -f lavfi -i sine=frequency=440:duration=20 -c:v libx264 -b:v 6M -pix_fmt yuv420p -c:a aac "$real/talk.mp4"
          $env:AUN_EXIT_AFTER_SECS = "150"
          $env:AUN_REAL_MEDIA = "1"; $env:AUN_STAGE_DIR = $real
          ./scripts/windows-studio-scenario.ps1 $exe en uploads preencode preencode-real-en $out "" preencode
          $env:AUN_REAL_MEDIA = ""; $env:AUN_STAGE_DIR = ""; $env:AUN_EXIT_AFTER_SECS = ""
          $screens += "editor-export-en", "editor-titles-export-ar", "preencode-real-en"
          foreach ($n in $screens) {
            if (-not (Select-String -Quiet "RESULT PASS" "artifacts/studio/$n.txt")) { throw "$n failed" }
            if (Test-Path "artifacts/studio/$n.txt.hang.txt") { throw "$n did not exit" }
          }
          if (-not (Select-String -Quiet "`tCaptionsServerStart`tTranscribe on the server" artifacts/studio/captions-en-dark.uia.txt)) { throw "captions server button not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "Edit the Arabic captions" artifacts/studio/captions-en-dark.uia.txt)) { throw "draft edit buttons have no accessible names" }
          if (-not (Select-String -Quiet -SimpleMatch "Text of line 1" artifacts/studio/captions-editor-en-dark.uia.txt)) { throw "cue text boxes have no accessible names" }
          if (-not (Select-String -Quiet -SimpleMatch "Start line 1 earlier" artifacts/studio/captions-editor-en-dark.uia.txt)) { throw "nudge buttons have no accessible names" }
          if (-not (Select-String -Quiet "`tAnalyticsScope`tShow" artifacts/studio/analytics-en-dark.uia.txt)) { throw "analytics scope has no accessible name" }
          if (-not (Select-String -Quiet -SimpleMatch "Switch to Masjid Media Team" artifacts/studio/brand-en-dark.uia.txt)) { throw "channel switch buttons have no accessible names" }
          if (-not (Select-String -Quiet -SimpleMatch "Only the owner can change it" artifacts/studio/brand-team-en-dark.uia.txt)) { throw "read-only brand kit not announced" }
          if (-not (Select-String -Quiet -SimpleMatch "Split at playhead" artifacts/studio/editor-en-dark.uia.txt)) { throw "editor tools not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "opening" artifacts/studio/editor-en-dark.uia.txt)) { throw "editor clip list not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "titleInExport=True" artifacts/studio/editor-titles-export-ar.txt)) { throw "the lower third is not in the exported video" }
          if (-not (Select-String -Quiet "`tEditorSaveTitle`tUpdate text" artifacts/studio/editor-titles-en-dark.uia.txt)) { throw "title editor not exposed" }
          if (-not (Select-String -Quiet "`tEditorSaveTitle`tحدّث النص" artifacts/studio/editor-titles-ar-dark.uia.txt)) { throw "Arabic title editor not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "Arabic text" artifacts/studio/editor-titles-en-dark.uia.txt)) { throw "title text boxes have no accessible names" }
          if (-not (Select-String -Quiet -SimpleMatch "(Lower third)" artifacts/studio/editor-titles-en-dark.uia.txt)) { throw "titles list not exposed" }
          ffmpeg -hide_banner -i edited.mp4 2>&1 | Select-String "Video:|Audio:|Duration" | Tee-Object artifacts/studio/edited-discover.txt
          if (-not (Select-String -Quiet "h264" artifacts/studio/edited-discover.txt)) { throw "export is not H.264" }
          if (-not (Select-String -Quiet "aac" artifacts/studio/edited-discover.txt)) { throw "export has no AAC audio" }
          if (-not (Select-String -Quiet "Duration: 00:00:0[78]" artifacts/studio/edited-discover.txt)) { throw "export length is not the 8 s cut" }
          if (-not (Select-String -Quiet "`tPreEncode`tPre-encode renditions on this computer" artifacts/studio/preencode-en-dark.uia.txt)) { throw "pre-encode option not exposed" }
          foreach ($n in "uploads-ar","signin-ar","signin-en","shell-ar","shell-en","accounts-en","signout-ar","addpasskey-en","addpasskey-ar","upload-staged-ar","upload-staged-en","videos-ar","videos-en","search-ar","edit-en","bulk-ar","delete-en","timeline-ar","encode-en") {
            if (-not (Select-String -Quiet "RESULT PASS" "artifacts/studio/$n.txt")) { throw "$n failed" }
            if (Test-Path "artifacts/studio/$n.txt.hang.txt") { throw "$n did not exit" }
          }
          # Screen readers: the sign-in button, channel picker and account menu are named.
          if (-not (Select-String -Quiet "`tSignIn`t" artifacts/studio/signin-en.uia.txt)) { throw "sign-in button not exposed to UI Automation" }
          # Native passkeys (webauthn.dll): passkey first, the browser sign-in one click away.
          Get-Content artifacts/studio/signin-en.txt
          if (-not (Select-String -Quiet -SimpleMatch "`tSignInPasskey`tSign in with a passkey" artifacts/studio/signin-en.uia.txt)) { throw "passkey sign-in button not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "`tSignIn`tSign in another way" artifacts/studio/signin-en.uia.txt)) { throw "'Sign in another way' not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "`tSignInPasskey`tالدخول بمفتاح المرور" artifacts/studio/signin-ar.uia.txt)) { throw "Arabic passkey button not exposed" }
          if (-not (Select-String -Quiet -SimpleMatch "`tAddPasskey`tAdd a passkey" artifacts/studio/accounts-en.uia.txt)) { throw "'Add a passkey' not in the account menu" }
          if (-not (Select-String -Quiet -SimpleMatch "Passkey added" artifacts/studio/addpasskey-en.uia.txt)) { throw "no 'Passkey added' dialog" }
          if (-not (Select-String -Quiet -SimpleMatch "أُضيف مفتاح المرور" artifacts/studio/addpasskey-ar.uia.txt)) { throw "no Arabic 'Passkey added' dialog" }
          if (-not (Select-String -Quiet "`tChannelPicker`tChannel" artifacts/studio/shell-en.uia.txt)) { throw "channel picker has no accessible name" }
          if (-not (Select-String -Quiet "`tAccountMenu`tAccount: Amina Studio" artifacts/studio/shell-en.uia.txt)) { throw "account menu has no accessible name" }
          if (-not (Select-String -Quiet "Sign out of" artifacts/studio/accounts-en.uia.txt)) { throw "account menu items not exposed" }
          if (-not (Select-String -Quiet "`tVideoSearch`tSearch your videos" artifacts/studio/videos-en.uia.txt)) { throw "video search has no accessible name" }
          if (-not (Select-String -Quiet "Select Seerah" artifacts/studio/videos-en.uia.txt)) { throw "row checkboxes have no accessible names" }
          if (-not (Select-String -Quiet "`tStartUpload`tUpload 3 videos" artifacts/studio/upload-staged-en.uia.txt)) { throw "upload button not exposed" }
          ffmpeg -hide_banner -i "$source.out.mp4" 2>&1 | Select-String "Video:|Duration" | Tee-Object artifacts/studio/discover.txt
          if (-not (Select-String -Quiet "h264" artifacts/studio/discover.txt)) { throw "output is not H.264" }
          # ffmpeg -i with no output file always exits 1; the checks above are the gate.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-windows
          path: artifacts/studio
