name: CI Studio Linux
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-studio-linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  studio-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Install GTK, libadwaita, GStreamer
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-1 libadwaita-1-0 xvfb imagemagick openbox gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-plugins-base-apps gstreamer1.0-libav libsecret-1-0 fonts-noto-core python3-pyatspi at-spi2-core dbus-x11 libgl1-mesa-dri adwaita-icon-theme xdotool libges-1.0-0 gstreamer1.0-plugins-bad
      - run: dotnet build src/AlUmmahNow.Studio.Linux -c Release
      - name: Run Studio scenarios
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          # Repaint every frame: under Xvfb the cairo renderer's partial repaints leave stale pixels (bits of
          # replaced buttons) in the captures.
          GSK_DEBUG: full-redraw
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p artifacts/studio watched
          truncate -s 2M watched/talk-one.mp4 watched/talk-two.mov
          gst-launch-1.0 -e videotestsrc num-buffers=150 ! video/x-raw,width=640,height=360,framerate=30/1 ! x264enc ! mp4mux name=m ! filesink location=$PWD/source.mp4 \
            audiotestsrc num-buffers=220 ! audioconvert ! avenc_aac ! m.
          # Editor sources: an English and an Arabic file name, so clip labels are checked in both directions.
          mkdir -p editor
          cp source.mp4 editor/opening.mp4
          gst-launch-1.0 -e videotestsrc pattern=ball num-buffers=90 ! video/x-raw,width=640,height=360,framerate=30/1 ! x264enc ! mp4mux name=m ! filesink location="$PWD/editor/سوق دمشق.mp4" \
            audiotestsrc wave=ticks num-buffers=140 ! audioconvert ! avenc_aac ! m.
          export AUN_EDITOR_FILES="$PWD/editor/opening.mp4|$PWD/editor/سوق دمشق.mp4"
          # dbus-run-session gives each run an accessibility bus, so the AT-SPI dump sees the app.
          run() { dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" scripts/studio-scenario.sh "$@" 2>&1 | tee artifacts/studio/$4.log || true; }
          run ar uploads "" uploads-ar artifacts/studio $PWD/watched
          run ar timeline "" signin-ar artifacts/studio "" "" 0
          run en timeline "" signin-en artifacts/studio "" "" 0
          run ar uploads shell shell-ar artifacts/studio
          run en uploads shell shell-en artifacts/studio
          run en uploads shell accounts-en artifacts/studio "" accounts
          run ar uploads shell signout-ar artifacts/studio "" signout
          mkdir -p staged && truncate -s 1500K "staged/مرئي 1.mp4" "staged/مرئي 2.mp4" "staged/video 10.mp4"
          AUN_STAGE_DIR=$PWD/staged run ar uploads shell upload-staged-ar artifacts/studio
          AUN_STAGE_DIR=$PWD/staged run en uploads shell upload-staged-en artifacts/studio
          run ar videos shell videos-ar artifacts/studio
          run en videos shell videos-en artifacts/studio
          run ar videos shell search-ar artifacts/studio "" search
          run en videos shell edit-en artifacts/studio "" edit
          run ar videos shell bulk-ar artifacts/studio "" bulk
          run en videos shell delete-en artifacts/studio "" delete
          run en timeline "" timeline-en artifacts/studio
          run ar timeline "" timeline-ar artifacts/studio
          run ar encode encode:$PWD/source.mp4 encode-ar artifacts/studio
          run en encode encode:$PWD/source.mp4 encode-en artifacts/studio
          # Studio screens (E19): captions and the cue editor, analytics, channels and brand kit, pre-encode; dark and light.
          for theme in dark light; do
            for lang in ar en; do
              AUN_THEME=$theme run $lang captions shell captions-$lang-$theme artifacts/studio
              AUN_THEME=$theme run $lang captions shell captions-editor-$lang-$theme artifacts/studio "" captions-editor
              AUN_THEME=$theme run $lang analytics shell analytics-$lang-$theme artifacts/studio
              AUN_THEME=$theme run $lang analytics shell analytics-video-$lang-$theme artifacts/studio "" analytics-video
              AUN_THEME=$theme run $lang brand shell brand-$lang-$theme artifacts/studio
              AUN_THEME=$theme run $lang brand shell brand-team-$lang-$theme artifacts/studio "" brand-team
              AUN_THEME=$theme AUN_STAGE_DIR=$PWD/staged run $lang uploads shell preencode-$lang-$theme artifacts/studio "" preencode
            done
          done
          # Editor (19.5): the cut timeline in both languages and themes, a real GES export, and a real pre-encode
          # (GStreamer per rung, Core packaging) against the demo server.
          for theme in dark light; do
            for lang in ar en; do
              AUN_THEME=$theme run $lang timeline "" editor-$lang-$theme artifacts/studio "" editor
              # Titles (19.5 + 19.9): a bilingual lower third in the demo brand kit's look and a centred title.
              AUN_THEME=$theme run $lang timeline "" editor-titles-$lang-$theme artifacts/studio "" editor-titles
            done
          done
          AUN_EXIT_AFTER=60 AUN_EXPORT_TO=$PWD/edited.mp4 run en timeline export editor-export-en artifacts/studio "" editor
          # A titled export: the app checks the lower third's box colour in the exported picture.
          AUN_EXIT_AFTER=70 AUN_EXPORT_TO=$PWD/titled.mp4 run ar timeline export editor-titles-export-ar artifacts/studio "" editor-titles
          mkdir -p real && cp source.mp4 real/talk.mp4
          AUN_EXIT_AFTER=60 AUN_REAL_MEDIA=1 AUN_STAGE_DIR=$PWD/real run en uploads preencode preencode-real-en artifacts/studio "" preencode
          grep -h AUTOMATION artifacts/studio/*.log
          test "$(cat artifacts/studio/*.log | grep -c 'RESULT PASS')" = 58
          grep "TITLE CHECK" artifacts/studio/editor-titles-export-ar.log | grep -q "; ok"
          grep -q "titles=2 titleInExport=True" artifacts/studio/editor-titles-export-ar.log
          grep -P "^button\tUpdate text$" artifacts/studio/editor-titles-en-dark.atspi.txt
          grep -P "^button\tحدّث النص$" artifacts/studio/editor-titles-ar-dark.atspi.txt
          grep -q "Arabic text" artifacts/studio/editor-titles-en-dark.atspi.txt
          grep -q "(Lower third)" artifacts/studio/editor-titles-en-dark.atspi.txt
          grep -P "^button\tSplit at playhead$" artifacts/studio/editor-en-dark.atspi.txt
          grep -P "^button\tقسّم عند المؤشر$" artifacts/studio/editor-ar-dark.atspi.txt
          grep -q "opening" artifacts/studio/editor-en-dark.atspi.txt
          gst-discoverer-1.0 edited.mp4 | tee artifacts/studio/edited-discover.txt
          grep -qi 'h.264' artifacts/studio/edited-discover.txt
          gst-discoverer-1.0 titled.mp4 | tee artifacts/studio/titled-discover.txt
          grep -q 'Duration: 0:00:0[78]' artifacts/studio/titled-discover.txt
          grep -qi 'aac\|mpeg-4 aac' artifacts/studio/edited-discover.txt
          grep -q 'Duration: 0:00:0[78]' artifacts/studio/edited-discover.txt
          # Screen readers (Orca reads AT-SPI): named controls on the shell, search, upload and rows.
          grep -P "^button\tSign in$" artifacts/studio/signin-en.atspi.txt
          grep -P "\tChannel$" artifacts/studio/shell-en.atspi.txt
          grep -P "^check box\tSeerah" artifacts/studio/videos-en.atspi.txt
          grep -P "^button\tUpload 3 videos$" artifacts/studio/upload-staged-en.atspi.txt
          grep -P "^button\tTranscribe on the server$" artifacts/studio/captions-en-dark.atspi.txt
          grep -P "^button\tSave and publish$" artifacts/studio/captions-editor-en-dark.atspi.txt
          grep -P "^button\tحفظ ونشر$" artifacts/studio/captions-editor-ar-dark.atspi.txt
          grep -P "^button\tExport CSV$" artifacts/studio/analytics-video-en-dark.atspi.txt
          grep -P "^button\tSave brand kit$" artifacts/studio/brand-en-dark.atspi.txt
          grep "Only the owner can change it" artifacts/studio/brand-team-en-dark.atspi.txt
          grep -P "^check box\tPre-encode renditions on this computer$" artifacts/studio/preencode-en-dark.atspi.txt
          gst-discoverer-1.0 source.mp4.out.mp4 | tee artifacts/studio/discover.txt
          grep -qi 'h.264' artifacts/studio/discover.txt
          ! grep -qi '4:4:4' artifacts/studio/discover.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-linux
          path: artifacts/studio
