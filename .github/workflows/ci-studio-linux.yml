name: CI Studio Linux
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-studio-linux-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  studio-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Install GTK, libadwaita, GStreamer
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-1 libadwaita-1-0 xvfb imagemagick openbox xdotool gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-plugins-base-apps gstreamer1.0-libav libsecret-1-0 fonts-noto-core python3-pyatspi at-spi2-core dbus-x11 libgl1-mesa-dri adwaita-icon-theme
      - run: dotnet build src/AlUmmahNow.Studio.Linux -c Release
      - name: Run Studio scenarios
        env:
          AUN_DEMO_TODAY: "2026-11-21"  # one demo "today" for every frame (DemoClock)
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p artifacts/studio watched
          truncate -s 2000000 watched/lecture-one.mp4 watched/lecture-two.mov
          gst-launch-1.0 -e videotestsrc num-buffers=150 ! video/x-raw,width=640,height=360,framerate=30/1 ! x264enc ! mp4mux name=m ! filesink location=$PWD/source.mp4 \
            audiotestsrc num-buffers=220 ! audioconvert ! avenc_aac ! m.
          # dbus-run-session gives each run an accessibility bus, so the AT-SPI dump sees the app.
          run() { dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" scripts/studio-scenario.sh "$@" 2>&1 | tee artifacts/studio/$4.log || true; }
          run ar uploads "" uploads-ar artifacts/studio $PWD/watched
          run ar timeline "" signin-ar artifacts/studio "" "" 0
          run en timeline "" signin-en artifacts/studio "" "" 0
          run ar uploads shell shell-ar artifacts/studio
          run en uploads shell shell-en artifacts/studio
          run en uploads shell accounts-en artifacts/studio "" accounts
          run ar uploads shell signout-ar artifacts/studio "" signout
          mkdir -p staged && truncate -s 1500000 "staged/درس 1.mp4" "staged/درس 2.mp4" "staged/lesson 10.mp4"
          AUN_STAGE_DIR=$PWD/staged run ar uploads shell upload-staged-ar artifacts/studio
          AUN_STAGE_DIR=$PWD/staged run en uploads shell upload-staged-en artifacts/studio
          run ar videos shell videos-ar artifacts/studio
          run en videos shell videos-en artifacts/studio
          run ar videos shell search-ar artifacts/studio "" search
          run en videos shell edit-en artifacts/studio "" edit
          run ar videos shell bulk-ar artifacts/studio "" bulk
          run en videos shell delete-en artifacts/studio "" delete
          AUN_EXIT_AFTER=32 AUN_ATSPI_PRESS="عرض كجدول" run ar analytics shell analytics-ar artifacts/studio
          AUN_EXIT_AFTER=32 AUN_ATSPI_PRESS="Show as a table" run en analytics shell analytics-en artifacts/studio
          AUN_EXIT_AFTER=32 AUN_ATSPI_PRESS="المحذوفة مؤخرًا (٣)" run ar videos shell deleted-ar artifacts/studio "" deleted
          AUN_EXIT_AFTER=32 AUN_ATSPI_PRESS="Recently deleted (3)" run en videos shell deleted-en artifacts/studio "" deleted
          run en timeline "" timeline-en artifacts/studio
          run ar timeline "" timeline-ar artifacts/studio
          run ar encode encode:$PWD/source.mp4 encode-ar artifacts/studio
          run en encode encode:$PWD/source.mp4 encode-en artifacts/studio
          # Hidden when off (owner rule 2026-11-16): no upload in the tier and analytics feature_off leave no tab.
          AUN_DEMO_FEATURES_OFF=upload,analytics,bulkSchedule run en uploads shell features-off-en artifacts/studio
          AUN_DEMO_FEATURES_OFF=upload,analytics,bulkSchedule run ar uploads shell features-off-ar artifacts/studio
          grep -h AUTOMATION artifacts/studio/*.log
          test "$(cat artifacts/studio/*.log | grep -c 'RESULT PASS')" = 25
          grep -q "page=uploads upload=True analytics=True bulkSchedule=True" artifacts/studio/shell-en.log
          grep -q "page=videos upload=False analytics=False bulkSchedule=False" artifacts/studio/features-off-en.log
          grep -q "page=videos upload=False analytics=False bulkSchedule=False" artifacts/studio/features-off-ar.log
          # Screen readers (Orca reads AT-SPI): named controls on the shell, search, upload and rows.
          grep -P "^button\tSign in$" artifacts/studio/signin-en.atspi.txt
          grep -P "^toggle button\t.*Channel$" artifacts/studio/shell-en.atspi.txt
          # Studio opens at rest, as the web: the header search never takes focus on its own.
          grep -q "searchFocused=False" artifacts/studio/shell-en.log
          grep -q "searchFocused=False" artifacts/studio/shell-ar.log
          # No text field at all on open, on any page (the Videos page has its own search field).
          for n in shell-en shell-ar videos-en videos-ar; do grep -q "fieldFocused=False" artifacts/studio/$n.log; done
          grep -P "^check box\tSeerah" artifacts/studio/videos-en.atspi.txt
          # The rows that open the table and the deleted videos have their names, and say whether they are open, before
          # and after they are pressed.
          for t in "analytics-en:Show as a table" "analytics-ar:عرض كجدول" "deleted-en:Recently deleted (3)" "deleted-ar:المحذوفة مؤخرًا (٣)"; do
            f=artifacts/studio/${t%%:*}; n=${t#*:}
            grep -P "^toggle button\t\Q$n\E$" $f.atspi.txt
            grep -P "^expandable\tcollapsed\t\Q$n\E$" $f.atspi.txt
            grep -P "^toggle button\t\Q$n\E$" $f.pressed.atspi.txt
            grep -P "^expandable\texpanded\t\Q$n\E$" $f.pressed.atspi.txt
          done
          grep -P "^button\tUpload 3 videos$" artifacts/studio/upload-staged-en.atspi.txt
          gst-discoverer-1.0 source.mp4.out.mp4 | tee artifacts/studio/discover.txt
          grep -qi 'h.264' artifacts/studio/discover.txt
          ! grep -qi '4:4:4' artifacts/studio/discover.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-linux
          path: artifacts/studio

  # Lantern Glass owner-review frames (the whole window, nothing else): 1440x900 in en/ar, Light/Dark,
  # identity menu closed and open; 1920x1080 and the 1024x700 minimum (icon rail) in en/ar, Light/Dark.
  # Demo data without the demo notice (AUN_STORE_SHOT=1).
  review-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Install GTK, libadwaita, GStreamer
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-1 libadwaita-1-0 xvfb imagemagick openbox xdotool gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good libsecret-1-0 fonts-noto-core python3-pyatspi at-spi2-core dbus-x11 libgl1-mesa-dri adwaita-icon-theme
      - run: dotnet build src/AlUmmahNow.Studio.Linux -c Release
      - name: Capture
        env:
          AUN_DEMO_TODAY: "2026-11-21"  # one demo "today" for every frame (DemoClock)
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
          AUN_STORE_SHOT: "1"
        run: |
          mkdir -p artifacts/review
          shot() { # <tab> <scene> <lang> <theme> <WIDTHxHEIGHT>
            local name="linux-$1-${2:-closed}-$3-$4-$5"
            AUN_WINDOW_SIZE=$5 AUN_THEME=$4 dbus-run-session -- xvfb-run -a -s "-screen 0 ${5}x24" \
              scripts/studio-scenario.sh $3 $1 shell "$name" artifacts/review "" "$2" > "artifacts/review/$name.log" 2>&1 || true
          }
          # Upload with three staged files and two watched ones uploading (simulated), so every card shows.
          # Staged files are Noor Channel's own new short clips (title cards with the Noor badge, scripts/title-cards.py
          # STAGED), named in the frame's language: each staged row shows its own first frame, an Arabic frame shows Arabic
          # names, and both languages sort to the same order. A clip runs its real length (one frame a second); a still card
          # compresses to almost nothing, so each file is then padded to the size a 720p clip of that length has, the same
          # in both languages.
          video() { # <card.jpg> <seconds> <bytes> <out.webm>
            gst-launch-1.0 -q multifilesrc location="$1" loop=true num-buffers="$2" caps="image/jpeg,framerate=1/1" ! jpegdec ! videoconvert \
              ! vp8enc deadline=1 target-bitrate=2000000 keyframe-max-dist=8 ! webmmux ! filesink location="$4"
            test "$(stat -c %s "$4")" -lt "$3"
            truncate -s "$3" "$4"
          }
          cards=tests/fixtures/staged-cards
          mkdir -p staged-en staged-ar watched
          video $cards/card-1.jpg 60 14632817 "staged-en/Hadith of the week, kindness in one minute.webm"
          video $cards/card-2.jpg 90 21407253 "staged-en/Khutbah highlights, gratitude.webm"
          video $cards/card-3.jpg 45 10894402 "staged-en/Surah Al-Kahf part two, preview.webm"
          video $cards/card-1.ar.jpg 60 14632817 "staged-ar/حديث الأسبوع، الرفق في دقيقة.webm"
          video $cards/card-2.ar.jpg 90 21407253 "staged-ar/خطبة الجمعة، مقتطفات عن الشكر.webm"
          video $cards/card-3.ar.jpg 45 10894402 "staged-ar/سورة الكهف الجزء الثاني، مقدمة.webm"
          ls -la staged-en staged-ar
          truncate -s 2000000 watched/friday-khutbah.mp4 watched/seerah-part-4.mov
          export AUN_WATCH_DIR=$PWD/watched
          # Title-card thumbnails in the frame's language (tests/fixtures/studio-thumbs, scripts/title-cards.py).
          export AUN_DEMO_THUMBS=$PWD/tests/fixtures/studio-thumbs
          n=0
          for lang in en ar; do for theme in dark light; do
            export AUN_STAGE_DIR=$PWD/staged-$lang
            shot uploads "" $lang $theme 1440x900; shot uploads channels $lang $theme 1440x900
            shot uploads "" $lang $theme 1920x1080; shot uploads "" $lang $theme 1024x700
            shot uploads scheduled $lang $theme 1440x900
            shot videos "" $lang $theme 1440x900; shot videos bulk $lang $theme 1440x900
            # The narrow window (icon rail) at full-page height for the scrolling pages, so no card or chart is cut off.
            shot videos "" $lang $theme 1920x1080; shot videos "" $lang $theme 1024x1180
            shot analytics "" $lang $theme 1440x900; shot analytics "" $lang $theme 1920x1080; shot analytics "" $lang $theme 1024x820
            shot timeline "" $lang $theme 1440x900; shot encode "" $lang $theme 1440x900; shot timeline "" $lang $theme 1024x700
            shot settings "" $lang $theme 1440x900; shot settings "" $lang $theme 1024x700
            # Signed out: the sign-in card.
            AUN_WINDOW_SIZE=1440x900 AUN_THEME=$theme dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" \
              scripts/studio-scenario.sh $lang timeline "" "linux-signin-closed-$lang-$theme-1440x900" artifacts/review "" "" 0 > "artifacts/review/linux-signin-$lang-$theme.log" 2>&1 || true
            shot encode active $lang $theme 1440x900
            shot videos deleted $lang $theme 1440x900; shot videos deleted-open $lang $theme 1440x900
            shot videos searchfocus $lang $theme 1440x900
            n=$((n+22))
          done; done
          for lang in en ar; do shot videos search $lang dark 1440x900; shot videos edit $lang dark 1440x900; shot videos delete $lang dark 1440x900; n=$((n+3)); done
          grep -h AUTOMATION artifacts/review/*.log
          test "$(cat artifacts/review/*.log | grep -c 'RESULT PASS')" = $n
          # The narrow window has the rail, with each icon in the middle of its row.
          for f in artifacts/review/*1024x*.log; do grep -q "rail=True railCentered=True" "$f" || { echo "no centered rail: $f"; exit 1; }; done
          # Days in US order, as on the web.
          grep -F "from Oct 25 to Nov 21" artifacts/review/linux-analytics-closed-en-light-1440x900.atspi.txt
          # The chart's 28 bars are seen on the light card: their edges, across the row above the axis.
          python3 scripts/edges-in-row.py artifacts/review/linux-analytics-closed-en-light-1440x900.png 650 360 840 3 50
          # The initials of the two accounts in Settings can be read on their circles.
          for f in artifacts/review/linux-settings-closed-en-*-1440x900.png; do python3 scripts/initials-contrast.py $f 897,228 897,267; done
          for f in artifacts/review/linux-settings-closed-ar-*-1440x900.png; do python3 scripts/initials-contrast.py $f 543,228 543,267; done
          grep -P "\tActing as$" artifacts/review/linux-uploads-channels-en-light-1440x900.atspi.txt
          grep -P "\tتتصرّف باسم$" artifacts/review/linux-uploads-channels-ar-light-1440x900.atspi.txt
          grep -P "^button\t.*Masjid Media Team Channel · Editor$" artifacts/review/linux-uploads-channels-en-light-1440x900.atspi.txt
          grep -P "^button\t.*فريق إعلام المسجد قناة، محرّر$" artifacts/review/linux-uploads-channels-ar-light-1440x900.atspi.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-linux-review
          path: artifacts/review/*.png
