name: CI Studio Linux
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-studio-linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  studio-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Install GTK, libadwaita, GStreamer
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-1 libadwaita-1-0 xvfb imagemagick openbox gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-plugins-base-apps gstreamer1.0-libav libsecret-1-0 fonts-noto-core python3-pyatspi at-spi2-core dbus-x11 libgl1-mesa-dri adwaita-icon-theme
      - run: dotnet build src/AlUmmahNow.Studio.Linux -c Release
      - name: Run Studio scenarios
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p artifacts/studio watched
          truncate -s 2M watched/lecture-one.mp4 watched/lecture-two.mov
          gst-launch-1.0 -e videotestsrc num-buffers=150 ! video/x-raw,width=640,height=360,framerate=30/1 ! x264enc ! mp4mux name=m ! filesink location=$PWD/source.mp4 \
            audiotestsrc num-buffers=220 ! audioconvert ! avenc_aac ! m.
          # dbus-run-session gives each run an accessibility bus, so the AT-SPI dump sees the app.
          run() { dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" scripts/studio-scenario.sh "$@" 2>&1 | tee artifacts/studio/$4.log || true; }
          run ar uploads "" uploads-ar artifacts/studio $PWD/watched
          run ar timeline "" signin-ar artifacts/studio "" "" 0
          run en timeline "" signin-en artifacts/studio "" "" 0
          run ar uploads shell shell-ar artifacts/studio
          run en uploads shell shell-en artifacts/studio
          run en uploads shell accounts-en artifacts/studio "" accounts
          run ar uploads shell signout-ar artifacts/studio "" signout
          mkdir -p staged && truncate -s 1500K "staged/درس 1.mp4" "staged/درس 2.mp4" "staged/lesson 10.mp4"
          AUN_STAGE_DIR=$PWD/staged run ar uploads shell upload-staged-ar artifacts/studio
          AUN_STAGE_DIR=$PWD/staged run en uploads shell upload-staged-en artifacts/studio
          run ar videos shell videos-ar artifacts/studio
          run en videos shell videos-en artifacts/studio
          run ar videos shell search-ar artifacts/studio "" search
          run en videos shell edit-en artifacts/studio "" edit
          run ar videos shell bulk-ar artifacts/studio "" bulk
          run en videos shell delete-en artifacts/studio "" delete
          run ar analytics shell analytics-ar artifacts/studio
          run en analytics shell analytics-en artifacts/studio
          run en timeline "" timeline-en artifacts/studio
          run ar timeline "" timeline-ar artifacts/studio
          run ar encode encode:$PWD/source.mp4 encode-ar artifacts/studio
          run en encode encode:$PWD/source.mp4 encode-en artifacts/studio
          grep -h AUTOMATION artifacts/studio/*.log
          test "$(cat artifacts/studio/*.log | grep -c 'RESULT PASS')" = 21
          # Screen readers (Orca reads AT-SPI): named controls on the shell, search, upload and rows.
          grep -P "^button\tSign in$" artifacts/studio/signin-en.atspi.txt
          grep -P "\tChannel$" artifacts/studio/shell-en.atspi.txt
          grep -P "^check box\tSeerah" artifacts/studio/videos-en.atspi.txt
          grep -P "^button\tUpload 3 videos$" artifacts/studio/upload-staged-en.atspi.txt
          gst-discoverer-1.0 source.mp4.out.mp4 | tee artifacts/studio/discover.txt
          grep -qi 'h.264' artifacts/studio/discover.txt
          ! grep -qi '4:4:4' artifacts/studio/discover.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-linux
          path: artifacts/studio
