name: CI Linux
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Install GTK, libadwaita, GStreamer
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libgtk-4-1 libadwaita-1-0 xvfb imagemagick openbox dbus-x11 libglib2.0-bin
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
            gstreamer1.0-libav gstreamer1.0-gtk4 fonts-noto-core libgl1-mesa-dri adwaita-icon-theme libsecret-1-0
      - run: dotnet build src/AlUmmahNow.Linux -c Release
      - name: Run viewer scenarios (ar and en, home and watch)
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p artifacts/linux
          # The watch scenarios play a committed fixture (video + captions), never a remote stream: opening
          # QA's HLS stream failed now and then on the runner and turned the gate red without a bug.
          export AUN_FIXTURE_MEDIA=$PWD/tests/fixtures/watch
          video=fixture
          export AUN_EXPECT_CAPTION=1
          run() {
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" scripts/linux-scenario.sh "$1" "$2" "$3" "$4" artifacts/linux 2>&1 | tee artifacts/linux/$4.log || true
          }
          run ar dark home home-ar-dark
          run en light home home-en-light
          run ar dark watch:$video watch-ar-dark
          run en light watch:$video watch-en-light
          grep -h -E 'AUTOMATION|MPRIS' artifacts/linux/*.log
          # The automation result, not the launcher exit status, is the gate.
          test "$(cat artifacts/linux/*.log | grep -c 'RESULT PASS')" = 4
          test "$(cat artifacts/linux/*.log | grep -cE 'core=[0-9]+\.[0-9]+\.[0-9]+')" = 4
          grep -q "MPRIS before: ('<'Playing'>',)\|MPRIS before: (<'Playing'>,)" artifacts/linux/watch-ar-dark.log
          grep -q "MPRIS after: (<'Paused'>,)" artifacts/linux/watch-ar-dark.log
      - name: Review frames (demo catalog with title cards; the watch frames from the fixture runs)
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # Owner review frames never show QA's test library: home uses the demo catalog and its title cards.
          mkdir -p artifacts/review
          export AUN_DEMO=1 AUN_DEMO_THUMBS=$PWD/tests/fixtures/viewer-thumbs
          # Home at full-page height (every rail, nothing cut at the window's bottom edge), en/ar in Light and Dark.
          for v in "ar dark home-ar-dark" "ar light home-ar-light" "en dark home-en-dark" "en light home-en-light"; do
            set -- $v
            AUN_WINDOW_SIZE=1280x2800 dbus-run-session -- xvfb-run -a -s "-screen 0 1280x2800x24" scripts/linux-scenario.sh "$1" "$2" home "$3" artifacts/review 2>&1 | tee artifacts/review/$3.log || true
          done
          test "$(cat artifacts/review/*.log | grep -c 'RESULT PASS')" = 4
          cp artifacts/linux/watch-*.png artifacts/review/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          path: artifacts/review/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-scenarios
          path: artifacts/linux

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - uses: ./.github/actions/apt-install
        with:
          packages: flatpak flatpak-builder
      - name: Publish self-contained app
        run: dotnet publish src/AlUmmahNow.Linux -c Release -r linux-x64 --self-contained -o artifacts/flatpak-input/publish
      - name: Build unsigned Flatpak bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=flatpak-repo build-dir packaging/flatpak/net.alummahnow.AlUmmahNow.yml
          flatpak build-bundle flatpak-repo artifacts/AlUmmahNow-unsigned.flatpak net.alummahnow.AlUmmahNow --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check the runtime provides gtk4paintablesink
        run: flatpak run --user --command=gst-inspect-1.0 org.gnome.Platform//49 gtk4paintablesink | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: artifacts/AlUmmahNow-unsigned.flatpak
