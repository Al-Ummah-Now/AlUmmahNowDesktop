name: CI
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build shared layer (all target frameworks)
        run: |
          dotnet build src/AlUmmahNow.CoreBridge -c Release
          dotnet build src/AlUmmahNow.App -c Release
      - name: Test shared layer
        run: |
          dotnet test tests/AlUmmahNow.App.Tests -c Release --logger trx --results-directory artifacts/test
          dotnet test tests/AlUmmahNow.Studio.Tests -c Release --logger trx --results-directory artifacts/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test
