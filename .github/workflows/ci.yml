name: CI
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build shared layer (all target frameworks)
        run: |
          dotnet build src/AlUmmahNow.CoreBridge -c Release
          dotnet build src/AlUmmahNow.App -c Release
      - name: Test shared layer
        run: dotnet test tests/AlUmmahNow.App.Tests -c Release --logger trx --results-directory artifacts/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test

  d9-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install GTK, libadwaita, GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libadwaita-1-0 xvfb imagemagick x11-apps openbox \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-gtk4 fonts-noto-core libgl1-mesa-dri
          lsb_release -ds; pkg-config --modversion gtk4 || dpkg -l | grep -E 'libgtk-4-1|libadwaita-1-0|gstreamer1.0-gtk4' | awk '{print $2,$3}'
          gst-inspect-1.0 gtk4paintablesink | head -5
      - run: dotnet build spikes/D9.GirCore -c Release
      - name: Run spike (ar, en)
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p artifacts/d9
          for l in ar en; do
            cat > run-$l.sh <<EOF
          openbox & sleep 2
          dotnet spikes/D9.GirCore/bin/Release/net9.0/D9.GirCore.dll --lang $l --seconds 25 --report artifacts/d9/report-$l.txt &
          p=\$!
          sleep 18
          import -window root artifacts/d9/$l.png
          wait \$p
          EOF
            xvfb-run -a -s "-screen 0 1280x800x24" bash run-$l.sh 2>&1 | tee artifacts/d9/log-$l.txt || true
          done
          cat artifacts/d9/report-*.txt
          # The report, not the launcher's exit status, is the gate.
          test "$(grep -c 'VIDEO VERDICT: PASS' artifacts/d9/report-ar.txt artifacts/d9/report-en.txt | grep -c ':1$')" = 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d9-spike
          path: artifacts/d9

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install GTK, libadwaita, GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libadwaita-1-0 xvfb imagemagick openbox dbus-x11 libglib2.0-bin \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-gtk4 fonts-noto-core libgl1-mesa-dri adwaita-icon-theme
      - run: dotnet build src/AlUmmahNow.Linux -c Release
      - name: Run viewer scenarios (ar and en, home and watch)
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p artifacts/linux
          video=ddd1c77b-4833-4d75-b1ce-105a4d083480
          run() {
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" scripts/linux-scenario.sh "$1" "$2" "$3" "$4" artifacts/linux 2>&1 | tee artifacts/linux/$4.log || true
          }
          run ar dark home home-ar-dark
          run en light home home-en-light
          run ar dark watch:$video watch-ar-dark
          run en light watch:$video watch-en-light
          grep -h -E 'AUTOMATION|MPRIS' artifacts/linux/*.log
          # The automation result, not the launcher exit status, is the gate.
          test "$(cat artifacts/linux/*.log | grep -c 'RESULT PASS')" = 4
          grep -q "MPRIS before: ('<'Playing'>',)\|MPRIS before: (<'Playing'>,)" artifacts/linux/watch-ar-dark.log
          grep -q "MPRIS after: (<'Paused'>,)" artifacts/linux/watch-ar-dark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          path: artifacts/linux
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - name: Publish self-contained app
        run: dotnet publish src/AlUmmahNow.Linux -c Release -r linux-x64 --self-contained -o artifacts/flatpak-input/publish
      - name: Build unsigned Flatpak bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=flatpak-repo build-dir packaging/flatpak/net.alummahnow.AlUmmahNow.yml
          flatpak build-bundle flatpak-repo artifacts/AlUmmahNow-unsigned.flatpak net.alummahnow.AlUmmahNow --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check the runtime provides gtk4paintablesink
        run: flatpak run --user --command=gst-inspect-1.0 org.gnome.Platform//49 gtk4paintablesink | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: artifacts/AlUmmahNow-unsigned.flatpak
