name: CI Windows
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Enable Media Foundation (optional feature on Windows Server)
        continue-on-error: true
        run: |
          Install-WindowsFeature Server-Media-Foundation | Format-List
      - name: Build unpackaged app
        run: dotnet build src/AlUmmahNow.Windows -c Release -p:Platform=x64
      - name: Run viewer scenarios (ar and en, home and watch)
        env:
          AUN_DEMO_TODAY: "2026-11-21"  # one demo "today" for every frame (DemoClock)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $exe = Resolve-Path "src/AlUmmahNow.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNow.exe"
          # The watch scenarios play a committed fixture (video + captions), never a remote stream: opening
          # QA's HLS stream failed now and then on the runner and turned the gate red without a bug.
          $env:AUN_FIXTURE_MEDIA = (Resolve-Path tests/fixtures/watch).Path
          $video = "fixture"
          $env:AUN_EXPECT_CAPTION = "1"
          $out = (Resolve-Path artifacts/windows).Path
          ./scripts/windows-scenario.ps1 $exe ar dark home home-ar-dark $out
          ./scripts/windows-scenario.ps1 $exe en light home home-en-light $out
          ./scripts/windows-scenario.ps1 $exe ar dark "watch:$video" watch-ar-dark $out
          ./scripts/windows-scenario.ps1 $exe en light "watch:$video" watch-en-light $out
          Get-Content artifacts/windows/*.txt
      - name: A scenario that wrote an exception has not passed
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP "scenario.txt"
          "AUTOMATION home RESULT PASS" | Set-Content $f
          if (-not ("$(./scripts/windows-result.ps1 $f)" -match "RESULT PASS")) { throw "a passed scenario was not shown as passed" }
          "theme: System.Exception" | Set-Content "$f.crash.txt"
          ./scripts/windows-result.ps1 $f
          if (Select-String -Quiet "RESULT PASS" $f) { throw "a crashed scenario passed" }
      - name: Check scenario results and clean exit
        shell: pwsh
        run: |
          foreach ($n in "home-ar-dark","home-en-light","watch-ar-dark","watch-en-light") {
            if (-not (Select-String -Quiet "RESULT PASS" "artifacts/windows/$n.txt")) { throw "$n failed" }
            if (-not (Select-String -Quiet "core=\d+\.\d+\.\d+" "artifacts/windows/$n.txt")) { throw "$n did not load the Rust core" }
            if (Test-Path "artifacts/windows/$n.txt.hang.txt") { throw "$n did not exit" }
          }
      - name: Review frames (demo catalog with title cards; the watch frames from the fixture runs)
        env:
          AUN_DEMO_TODAY: "2026-11-21"  # one demo "today" for every frame (DemoClock)
        shell: pwsh
        run: |
          # Owner review frames never show QA's test library: home uses the demo catalog and its title cards.
          $exe = Resolve-Path "src/AlUmmahNow.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNow.exe"
          $out = (New-Item -ItemType Directory -Force artifacts/review).FullName
          $env:AUN_DEMO = "1"; $env:AUN_DEMO_THUMBS = (Resolve-Path tests/fixtures/viewer-thumbs).Path
          ./scripts/windows-scenario.ps1 $exe ar dark home home-ar-dark $out
          ./scripts/windows-scenario.ps1 $exe en light home home-en-light $out
          foreach ($n in "home-ar-dark","home-en-light") { if (-not (Select-String -Quiet "RESULT PASS" "$out/$n.txt")) { throw "review $n failed" } }
          Copy-Item artifacts/windows/watch-*.png $out
      - name: Live scenarios (fixture streams; every page in both languages and modes when run by hand)
        env:
          AUN_DEMO_TODAY: "2026-11-21"
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $exe = Resolve-Path "src/AlUmmahNow.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNow.exe"
          $out = (New-Item -ItemType Directory -Force artifacts/live).FullName
          $env:AUN_DEMO = "1"; $env:AUN_DEMO_LIVE = "1"
          $env:AUN_DEMO_THUMBS = (Resolve-Path tests/fixtures/viewer-thumbs).Path
          $env:AUN_FIXTURE_MEDIA = (Resolve-Path tests/fixtures/watch).Path
          $runs = @()
          if ($env:ALL -eq "true") {
            # page, automation, what the demo is set to, seconds to the shot (a pause counts as behind after 10)
            $pages = @(
              @("home", "home", @{}, 12), @("list", "live", @{}, 12), @("live", "live:demo-live", @{}, 12),
              @("behind", "behind:demo-live", @{}, 18), @("premiere", "live:demo-premiere", @{}, 12),
              @("soon", "live:demo-soon", @{}, 12), @("recording", "live:demo-recording", @{}, 12),
              @("ended", "live:demo-ended", @{}, 12), @("canceled", "live:demo-canceled", @{}, 12),
              @("premiere-ended", "live:demo-premiere-ended", @{}, 12), @("premiere-canceled", "live:demo-premiere-canceled", @{}, 12),
              @("remind-signin", "remind-signin:demo-soon", @{ AUN_DEMO_AUTH = "waiting" }, 12),
              @("remind-set", "remind-set:demo-soon", @{ AUN_DEMO_AUTH = "in" }, 12),
              @("remind-failed", "remind-failed:demo-soon", @{ AUN_DEMO_AUTH = "in"; AUN_DEMO_REMIND = "fail" }, 12),
              @("home-off", "home", @{ AUN_DEMO_LIVE = "off" }, 12), @("live-off", "live:demo-live", @{ AUN_DEMO_LIVE = "off" }, 12),
              @("soon-off", "live:demo-soon", @{ AUN_DEMO_LIVE = "off" }, 12)
            )
            foreach ($lang in "en","ar") { foreach ($theme in "dark","light") { foreach ($p in $pages) { $runs += ,@($lang, $theme, $p[1], "$($p[0])-$lang-$theme", $p[2], $p[3]) } } }
          } else {
            $runs += ,@("ar", "light", "live", "list-ar-light")
            $runs += ,@("ar", "dark", "live:demo-live", "live-ar-dark")
            $runs += ,@("en", "light", "live:demo-premiere", "premiere-en-light")
            $runs += ,@("en", "dark", "live:demo-recording", "recording-en-dark")
          }
          foreach ($r in $runs) {
            $set = if ($r.Count -gt 4) { $r[4] } else { @{} }
            $shot = if ($r.Count -gt 5) { $r[5] } else { 12 }
            $env:AUN_DEMO_LIVE = "1"; $env:AUN_DEMO_AUTH = ""; $env:AUN_DEMO_REMIND = ""
            foreach ($k in $set.Keys) { Set-Item "env:$k" $set[$k] }
            ./scripts/windows-scenario.ps1 $exe $r[0] $r[1] $r[2] $r[3] $out $shot ($shot + 5)
          }
          foreach ($r in $runs) { if (-not (Select-String -Quiet "RESULT PASS" "$out/$($r[3]).txt")) { throw "live $($r[3]) failed" } }
          # High contrast, and off again: turned on while the viewer runs, and on from the start; only the system's colors are drawn.
          $env:AUN_DEMO_LIVE = "1"; $env:AUN_DEMO_AUTH = ""; $env:AUN_DEMO_REMIND = ""
          $high = @()
          try {
            ./scripts/windows-scenario.ps1 $exe en light live:demo-live live-highcontrastswitch-en-light $out 22 28 switch; $high += "live-highcontrastswitch-en-light"
            $pages = @(@("home", "home", 12), @("list", "live", 12), @("live", "live:demo-live", 12), @("behind", "behind:demo-live", 18), @("recording", "live:demo-recording", 12), @("premiere", "live:demo-premiere", 12))
            foreach ($lang in "en","ar") { foreach ($theme in "dark","light") { foreach ($p in $pages) {
              if ($env:ALL -ne "true" -and ("$lang$theme" -notin "enlight","ardark" -or $p[0] -notin "home","behind")) { continue }
              $name = "$($p[0])-highcontrast-$lang-$theme"
              ./scripts/windows-scenario.ps1 $exe $lang $theme $p[1] $name $out $p[2] ($p[2] + 5) on; $high += $name
            } } }
          } finally { ./scripts/high-contrast.ps1 off }
          foreach ($n in $high) { if (-not (Select-String -Quiet "highContrast=True.*RESULT PASS" "$out/$n.txt")) { throw "$n failed: $(Get-Content "$out/$n.txt")" } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-live
          path: artifacts/live
      - name: Build unsigned MSIX
        run: dotnet build src/AlUmmahNow.Windows -c Release -p:Platform=x64 -p:BuildMsix=true -p:AppxPackageDir=${{ github.workspace }}/artifacts/msix/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: artifacts/review/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-scenarios
          path: artifacts/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msix
          path: artifacts/msix

  # The update bar, the screen of an unsupported version and Settings → Updates, in both languages and modes.
  updates:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Enable Media Foundation (optional feature on Windows Server)
        continue-on-error: true
        run: |
          Install-WindowsFeature Server-Media-Foundation | Format-List
      - name: Build unpackaged app
        run: dotnet build src/AlUmmahNow.Windows -c Release -p:Platform=x64
      - name: Update scenes
        env:
          AUN_DEMO_TODAY: "2026-11-21"
          AUN_DEMO: "1"
          AUN_DEMO_LIVE: "1"
        shell: pwsh
        run: |
          ./scripts/set-resolution.ps1 1920 1080
          $exe = Resolve-Path "src/AlUmmahNow.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNow.exe"
          $out = (New-Item -ItemType Directory -Force artifacts/updates).FullName
          $env:AUN_DEMO_THUMBS = (Resolve-Path tests/fixtures/viewer-thumbs).Path
          $env:AUN_FIXTURE_MEDIA = (Resolve-Path tests/fixtures/watch).Path
          $failed = @()
          foreach ($scene in "bar","notes","dismissed","forced","waiting","required","settings","uptodate","offline","off") { foreach ($lang in "en","ar") { foreach ($theme in "dark","light") {
            $name = "windows-viewer-update-$scene-$lang-$theme"
            $env:AUN_DEMO_UPDATE = $scene
            # It waits for a stream that is on air and playing
            if ($scene -eq "waiting") { ./scripts/windows-scenario.ps1 $exe $lang $theme "live:demo-live" $name $out 19 23 } else { ./scripts/windows-scenario.ps1 $exe $lang $theme home $name $out 13 17 }
            if (-not (Select-String -Quiet "update=${scene}:ok.*RESULT PASS" "$out/$name.txt")) { $failed += $name }
          } } }
          # High contrast, and off again: the bar and the screen are the system's colors.
          $contrast = ./scripts/high-contrast.ps1 on
          if ("$contrast" -notmatch "on=True") { $failed += "high contrast was not turned on: $contrast" }
          foreach ($scene in "bar","forced","settings") { foreach ($lang in "en","ar") {
            $name = "windows-viewer-update-$scene-$lang-highcontrast"
            $env:AUN_DEMO_UPDATE = $scene
            ./scripts/windows-scenario.ps1 $exe $lang dark home $name $out 13 17
            if (-not (Select-String -Quiet "update=${scene}:ok.*RESULT PASS" "$out/$name.txt")) { $failed += $name }
          } }
          ./scripts/high-contrast.ps1 off
          # A scene whose window is not as it must be fails.
          $wrong = (New-Item -ItemType Directory -Force artifacts/updates-wrong).FullName
          $env:AUN_DEMO_UPDATE = "forced"; $env:AUN_DEMO_UPDATE_ANSWER = "bar"
          ./scripts/windows-scenario.ps1 $exe en dark home wrong $wrong 13 17
          if (-not (Select-String -Quiet "RESULT FAIL" "$wrong/wrong.txt")) { $failed += "a wrong scene passed" }
          if ($failed.Count -gt 0) { throw "failed: $failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-updates
          path: artifacts/updates
