name: CI Windows
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch AlUmmahNow.Core
        shell: bash
        run: ./scripts/fetch-core.sh
      - name: Enable Media Foundation (optional feature on Windows Server)
        continue-on-error: true
        run: |
          Install-WindowsFeature Server-Media-Foundation | Format-List
      - name: Build unpackaged app
        run: dotnet build src/AlUmmahNow.Windows -c Release -p:Platform=x64
      - name: Run viewer scenarios (ar and en, home and watch)
        env:
          AUN_DEMO_TODAY: "2026-11-21"  # one demo "today" for every frame (DemoClock)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $exe = Resolve-Path "src/AlUmmahNow.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNow.exe"
          # The watch scenarios play a committed fixture (video + captions), never a remote stream: opening
          # QA's HLS stream failed now and then on the runner and turned the gate red without a bug.
          $env:AUN_FIXTURE_MEDIA = (Resolve-Path tests/fixtures/watch).Path
          $video = "fixture"
          $env:AUN_EXPECT_CAPTION = "1"
          $out = (Resolve-Path artifacts/windows).Path
          ./scripts/windows-scenario.ps1 $exe ar dark home home-ar-dark $out
          ./scripts/windows-scenario.ps1 $exe en light home home-en-light $out
          ./scripts/windows-scenario.ps1 $exe ar dark "watch:$video" watch-ar-dark $out
          ./scripts/windows-scenario.ps1 $exe en light "watch:$video" watch-en-light $out
          Get-Content artifacts/windows/*.txt
      - name: Check scenario results and clean exit
        shell: pwsh
        run: |
          foreach ($n in "home-ar-dark","home-en-light","watch-ar-dark","watch-en-light") {
            if (-not (Select-String -Quiet "RESULT PASS" "artifacts/windows/$n.txt")) { throw "$n failed" }
            if (-not (Select-String -Quiet "core=\d+\.\d+\.\d+" "artifacts/windows/$n.txt")) { throw "$n did not load the Rust core" }
            if (Test-Path "artifacts/windows/$n.txt.hang.txt") { throw "$n did not exit" }
          }
      - name: Review frames (demo catalog with title cards; the watch frames from the fixture runs)
        env:
          AUN_DEMO_TODAY: "2026-11-21"  # one demo "today" for every frame (DemoClock)
        shell: pwsh
        run: |
          # Owner review frames never show QA's test library: home uses the demo catalog and its title cards.
          $exe = Resolve-Path "src/AlUmmahNow.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNow.exe"
          $out = (New-Item -ItemType Directory -Force artifacts/review).FullName
          $env:AUN_DEMO = "1"; $env:AUN_DEMO_THUMBS = (Resolve-Path tests/fixtures/viewer-thumbs).Path
          ./scripts/windows-scenario.ps1 $exe ar dark home home-ar-dark $out
          ./scripts/windows-scenario.ps1 $exe en light home home-en-light $out
          foreach ($n in "home-ar-dark","home-en-light") { if (-not (Select-String -Quiet "RESULT PASS" "$out/$n.txt")) { throw "review $n failed" } }
          Copy-Item artifacts/windows/watch-*.png $out
      - name: Live scenarios (fixture streams; every page in both languages and modes when run by hand)
        env:
          AUN_DEMO_TODAY: "2026-11-21"
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $exe = Resolve-Path "src/AlUmmahNow.Windows/bin/x64/Release/net9.0-windows10.0.22621.0/win-x64/AlUmmahNow.exe"
          $out = (New-Item -ItemType Directory -Force artifacts/live).FullName
          $env:AUN_DEMO = "1"; $env:AUN_DEMO_LIVE = "1"
          $env:AUN_DEMO_THUMBS = (Resolve-Path tests/fixtures/viewer-thumbs).Path
          $env:AUN_FIXTURE_MEDIA = (Resolve-Path tests/fixtures/watch).Path
          $runs = @()
          if ($env:ALL -eq "true") {
            $pages = [ordered]@{ home = "home"; list = "live"; live = "live:demo-live"; premiere = "live:demo-premiere"; soon = "live:demo-soon"; recording = "live:demo-recording" }
            foreach ($lang in "en","ar") { foreach ($theme in "dark","light") { foreach ($page in $pages.Keys) { $runs += ,@($lang, $theme, $pages[$page], "$page-$lang-$theme") } } }
          } else {
            $runs += ,@("ar", "light", "live", "list-ar-light")
            $runs += ,@("ar", "dark", "live:demo-live", "live-ar-dark")
            $runs += ,@("en", "light", "live:demo-premiere", "premiere-en-light")
            $runs += ,@("en", "dark", "live:demo-recording", "recording-en-dark")
          }
          foreach ($r in $runs) { ./scripts/windows-scenario.ps1 $exe $r[0] $r[1] $r[2] $r[3] $out 12 17 }
          foreach ($r in $runs) { if (-not (Select-String -Quiet "RESULT PASS" "$out/$($r[3]).txt")) { throw "live $($r[3]) failed" } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-live
          path: artifacts/live
      - name: Build unsigned MSIX
        run: dotnet build src/AlUmmahNow.Windows -c Release -p:Platform=x64 -p:BuildMsix=true -p:AppxPackageDir=${{ github.workspace }}/artifacts/msix/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: artifacts/review/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-scenarios
          path: artifacts/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msix
          path: artifacts/msix
