name: CI Tizen
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-tizen-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tizen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build unsigned Tizen TV package
        run: dotnet build src/AlUmmahNow.Tizen -c Release
      - name: Check a TPK was produced
        run: find src/AlUmmahNow.Tizen/bin -name '*.tpk' | tee tpk.txt && test -s tpk.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tizen-tpk
          path: src/AlUmmahNow.Tizen/bin/**/*.tpk
